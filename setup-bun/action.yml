name: Setup Bun
description: >
  Install Bun, restore its install-store cache, optionally restore an extra caller-defined
  cache (e.g. a framework build cache), optionally install a Node.js runtime alongside Bun,
  optionally install Playwright browsers, then run `bun install`.

inputs:
  bun-version:
    description: >
      Bun version to install. Leave empty to resolve from working-directory/package.json's
      packageManager field instead (see bun-version-file below).
    required: false
    default: ""
  working-directory:
    description: Directory containing package.json/bun.lock.
    required: false
    default: "."
  install-args:
    description: >
      Extra args for `bun install` (e.g. --no-frozen-lockfile). Bun already installs frozen
      when CI=true, which GitHub-hosted runners always set, so this is only needed to override
      that default.
    required: false
    default: ""
  extra-cache-paths:
    description: >
      Additional newline-separated paths to cache/restore beyond the Bun install store.
      Requires extra-cache-key to also be set.
    required: false
    default: ""
  extra-cache-key:
    description: Cache key fragment for extra-cache-paths.
    required: false
    default: ""
  extra-cache-restore-key-fragment:
    description: >
      Restore-key fragment for the extra cache (e.g. a lockfile hash) — this action prepends
      its own prefix, so pass only the fragment, not the full restore-key string.
    required: false
    default: ""
  install-playwright:
    description: When true, installs Playwright browsers (no caching — see README).
    required: false
    default: "false"
  playwright-browsers:
    description: >
      Space-separated browser names to scope the Playwright install to (e.g. "chromium").
      Empty installs Playwright's full default set.
    required: false
    default: ""
  node-version:
    description: >
      When set, installs this Node.js version via actions/setup-node before Bun setup. Bun
      does not need this for itself; some repos need a Node runtime present for a sub-tool
      that shells out to `node`.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether the Bun install-store cache was hit.
    value: ${{ steps.bun-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: ${{ inputs.bun-version == '' && format('{0}/package.json', inputs.working-directory) || '' }}

    - name: Verify lockfile exists
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        if [ ! -f "$WORKING_DIRECTORY/bun.lock" ]; then
          echo "::error::$WORKING_DIRECTORY/bun.lock not found — refusing to build a cache key from a missing lockfile" >&2
          exit 1
        fi

    - name: Cache Bun install store
      id: bun-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache extra paths
      if: inputs.extra-cache-paths != '' && inputs.extra-cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.extra-cache-paths }}
        key: ${{ runner.os }}-bun-extra-${{ inputs.extra-cache-key }}
        restore-keys: |
          ${{ runner.os }}-bun-extra-${{ inputs.extra-cache-restore-key-fragment }}

    - name: bun install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        if [ -n "$INSTALL_ARGS" ]; then
          # INSTALL_ARGS may hold multiple space-separated flags; word-splitting is intentional.
          # shellcheck disable=SC2086
          bun install $INSTALL_ARGS
        else
          bun install
        fi

    - name: Install Playwright
      if: inputs.install-playwright == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        if [ -n "$PLAYWRIGHT_BROWSERS" ]; then
          # PLAYWRIGHT_BROWSERS may hold multiple space-separated browser names; word-splitting is intentional.
          # shellcheck disable=SC2086
          bunx playwright install --with-deps $PLAYWRIGHT_BROWSERS
        else
          bunx playwright install --with-deps
        fi
