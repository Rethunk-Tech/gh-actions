name: Setup Next.js + Bun
description: >
  Install Bun, restore its install-store cache, restore Next.js's .next/cache build cache,
  optionally install a Node.js runtime alongside Bun, optionally install Playwright browsers,
  run `bun install`, and disable Next telemetry. Does not compose setup-bun (see repo README
  for why) — duplicates its core steps directly. Single Next app per next-app-directory; for a
  multi-app repo, call this once per app (each with its own next-app-directory).

inputs:
  bun-version:
    description: >
      Bun version to install. Leave empty to resolve from working-directory/package.json's
      packageManager field instead.
    required: false
    default: ""
  working-directory:
    description: >
      Directory to run `bun install` in — a Bun workspace root, or the Next app's own
      directory for a single-app repo (package.json/bun.lock live here).
    required: false
    default: "."
  next-app-directory:
    description: >
      Directory containing the Next app's build output (.next/) and source files, when it
      differs from working-directory — e.g. a Bun workspace where install runs at the repo
      root but the Next app lives at apps/dashboard. Leave empty to default to
      working-directory (the single-app case).
    required: false
    default: ""
  install-playwright:
    description: >
      When true, installs Playwright browsers, caching them by the resolved @playwright/test
      (or playwright) version in working-directory/package.json — a version bump invalidates
      the cache outright rather than partially restoring a stale browser build, matching
      Playwright's own documented CI caching guide.
    required: false
    default: "false"
  playwright-browsers:
    description: >
      Space-separated browser names to scope the Playwright install to (e.g. "chromium").
      Empty installs Playwright's full default set.
    required: false
    default: ""
  node-version:
    description: When set, installs this Node.js version via actions/setup-node before Bun setup.
    required: false
    default: ""
  playwright-directory:
    description: >
      Directory whose package.json pins the Playwright version, and where the browser install
      runs. Empty defaults to working-directory. Set it when the install root and the
      Playwright app differ — a Bun workspace where `bun install` runs at the repo root but
      the browsers must match apps/web's own @playwright/test, which is otherwise resolved
      against the root package.json and cached under the wrong version.
    required: false
    default: ""
  extra-cache-paths:
    description: >
      Additional paths to cache beyond Bun's install store, in actions/cache `path` form
      (newline-separated for more than one). Caching is skipped unless extra-cache-key is
      also set. For build caches a repo owns but does not want to key on its lockfile —
      a Turborepo .turbo directory, say.
    required: false
    default: ""
  extra-cache-key:
    description: >
      Fragment appended to the extra-paths cache key, after `<os>-bun-extra-`. Make it
      change whenever the cached content should be rebuilt — a commit SHA for a build
      cache that should always save fresh, a hashFiles() for one keyed on its inputs.
    required: false
    default: ""
  extra-cache-restore-key-fragment:
    description: >
      Fragment appended to the extra-paths restore-keys prefix, after `<os>-bun-extra-`.
      Empty means restore from any previous extra cache for this OS, which is what a
      SHA-keyed build cache wants — the key never repeats, so the prefix is the only
      thing that can match.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether the Bun install-store cache was hit.
    value: ${{ steps.bun-cache.outputs.cache-hit }}
  playwright-cache-hit:
    description: Whether the Playwright browser cache was hit (empty when install-playwright is off).
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: ${{ inputs.bun-version == '' && format('{0}/package.json', inputs.working-directory) || '' }}

    - name: Verify lockfile exists, resolve Next app + cache dirs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NEXT_APP_DIRECTORY_INPUT: ${{ inputs.next-app-directory }}
      run: |
        if [ ! -f "$WORKING_DIRECTORY/bun.lock" ]; then
          echo "::error::$WORKING_DIRECTORY/bun.lock not found — refusing to build a cache key from a missing lockfile" >&2
          exit 1
        fi
        # Resolved here (not inlined as inputs.*/env.* expressions in the cache steps below)
        # so a consumer that nests this action inside their own local composite doesn't hit
        # the actions/cache post-step context bug for local composite nesting
        # (actions/runner#2009, #2030) — see repo README. Falls back to working-directory
        # when next-app-directory is unset (the single-app case, e.g. no Bun workspace).
        NEXT_APP_DIR="${NEXT_APP_DIRECTORY_INPUT:-$WORKING_DIRECTORY}"
        echo "NEXT_APP_DIR=${NEXT_APP_DIR}" >> "$GITHUB_ENV"
        echo "NEXT_CACHE_DIR=${NEXT_APP_DIR}/.next/cache" >> "$GITHUB_ENV"

    # No restore-keys: see the same step in setup-bun for the measured store growth.
    - name: Cache Bun install store
      id: bun-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}

    # The runner re-evaluates a cache step's `with:` in its post step, after bun install and the
    # caller's build. A hashFiles() source glob in the key then walks node_modules and .next:
    # 15s of Rethunk-Tech/Website's 16s "Post Setup Bun + Next.js" went there before tar
    # started. Hashing once here, before either exists, leaves the post step a variable lookup.
    - name: Hash Next.js sources
      shell: bash
      env:
        NEXT_SRC_HASH: ${{ hashFiles(format('{0}/**/*.js', env.NEXT_APP_DIR), format('{0}/**/*.jsx', env.NEXT_APP_DIR), format('{0}/**/*.ts', env.NEXT_APP_DIR), format('{0}/**/*.tsx', env.NEXT_APP_DIR), format('!{0}/**/node_modules/**', env.NEXT_APP_DIR), format('!{0}/**/.next/**', env.NEXT_APP_DIR)) }}
      run: echo "NEXT_SRC_HASH=$NEXT_SRC_HASH" >> "$GITHUB_ENV"

    - name: Cache Next.js build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.NEXT_CACHE_DIR }}
        key: ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}-${{ env.NEXT_SRC_HASH }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}-

    - name: Cache extra paths
      if: inputs.extra-cache-paths != '' && inputs.extra-cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.extra-cache-paths }}
        key: ${{ runner.os }}-bun-extra-${{ inputs.extra-cache-key }}
        restore-keys: |
          ${{ runner.os }}-bun-extra-${{ inputs.extra-cache-restore-key-fragment }}

    - name: bun install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install

    # Version-keyed rather than lockfile-keyed on purpose: Playwright's own CI caching guide
    # keys on the @playwright/test devDependency version specifically, because a browser build
    # must match the exact npm package version — a partial restore-keys match would silently
    # reuse a browser build that doesn't match a newer package.
    - name: Resolve Playwright version
      id: playwright-version
      if: inputs.install-playwright == 'true'
      shell: bash
      working-directory: ${{ inputs.playwright-directory != '' && inputs.playwright-directory || inputs.working-directory }}
      run: |
        version=$(bun --print "const p=require('./package.json'); (p.devDependencies&&p.devDependencies['@playwright/test'])||(p.dependencies&&p.dependencies['@playwright/test'])||(p.devDependencies&&p.devDependencies.playwright)||(p.dependencies&&p.dependencies.playwright)||'unpinned'" 2>/dev/null || echo unpinned)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      if: inputs.install-playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.playwright-directory != '' && inputs.playwright-directory || inputs.working-directory }}
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        # PLAYWRIGHT_BROWSERS may hold multiple space-separated browser names; word-splitting is
        # intentional, and an empty value leaves no arguments, which installs the default set.
        # shellcheck disable=SC2086
        set -- $PLAYWRIGHT_BROWSERS
        bunx playwright install "$@"

    # Skips a font-only gap on every job; see the same step in setup-bun for the measurement
    # and why fonts are safe to skip.
    - name: Install Playwright system deps
      if: inputs.install-playwright == 'true'
      shell: bash
      working-directory: ${{ inputs.playwright-directory != '' && inputs.playwright-directory || inputs.working-directory }}
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        # PLAYWRIGHT_BROWSERS may hold multiple space-separated browser names; word-splitting is intentional.
        # shellcheck disable=SC2086
        set -- $PLAYWRIGHT_BROWSERS
        if [ "$RUNNER_OS" = "Linux" ]; then
          report=$(bunx playwright install-deps --dry-run "$@" 2>&1) || true
          if printf '%s\n' "$report" | grep -q '^All system dependencies are installed'; then
            echo "Playwright system dependencies are already installed"
            exit 0
          fi
          if printf '%s\n' "$report" | grep -q '^Missing system dependencies'; then
            libs=$(printf '%s\n' "$report" | sed -n 's/^  \([^ ]*\)$/\1/p' | grep -Ev '^x?fonts-' || true)
            if [ -z "$libs" ]; then
              echo "Only fonts are missing; skipping Playwright install-deps"
              exit 0
            fi
          fi
        fi
        bunx playwright install-deps "$@"

    - name: Disable Next telemetry
      shell: bash
      run: echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
