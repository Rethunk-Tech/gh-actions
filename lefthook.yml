pre-commit:
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner --log-level warn

pre-push:
  jobs:
    - name: gate
      run: gate
    # Real downstream callers under act: the only check that runs an action the way the fleet does.
    - name: act-callers
      glob: "{*/**,scripts/*}"
      run: scripts/act-callers.sh
