name: Setup Rust
description: >
  Install a Rust toolchain with the runner's preinstalled rustup — from rust-toolchain.toml or an
  explicit channel — plus components and targets, and cache the cargo registry, git
  dependencies and target/ per job. Optionally run cargo clippy, cargo fmt,
  cargo test, and/or cargo audit as gates on the same job — opt-in, off by default.

inputs:
  toolchain:
    description: >
      Toolchain to install and make the rustup default (e.g. "stable", "1.98"). Leave empty to
      install whatever working-directory's rust-toolchain.toml (or rust-toolchain) names,
      falling back to stable when there is none. A toolchain file still outranks the rustup
      default inside its directory, so a job checking an older toolchain against a repo that
      pins stable runs `cargo +<toolchain> ...`.
    required: false
    default: ""
  components:
    description: Extra components, comma- or space-separated (e.g. "rustfmt, clippy").
    required: false
    default: ""
  targets:
    description: Extra targets, comma- or space-separated (e.g. "aarch64-unknown-linux-gnu").
    required: false
    default: ""
  working-directory:
    description: Directory containing Cargo.lock and any rust-toolchain.toml.
    required: false
    default: "."
  run-clippy:
    description: >
      When true, installs clippy if it is not already on the toolchain and runs
      `cargo clippy --locked --all-targets -- -D warnings` from working-directory.
      Turns this action into a job gate for callers who opt in — off by default.
    required: false
    default: "false"
  run-fmt:
    description: >
      When true, installs rustfmt if it is not already on the toolchain and runs
      `cargo fmt --all -- --check` from working-directory. Separate from run-clippy
      because clippy does not check formatting, and enabling both from one input would
      fail every repo that has only ever run clippy. Off by default.
    required: false
    default: "false"
  run-test:
    description: >
      When true, runs `cargo test --locked --all-targets` from working-directory.
      Separate from run-clippy and run-fmt, which do not run the test suite. Off by default.
    required: false
    default: "false"
  run-audit:
    description: >
      When true, downloads a checksum-verified cargo-audit binary and runs `cargo-audit audit`
      from working-directory against Cargo.lock, failing on any vulnerability advisory. Does not
      need a compiled project. Linux and macOS runners only. Off by default.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: Whether the cargo cache was restored from an exact key match for this job.
    value: ${{ steps.cargo-cache.outputs.cache-hit }}
  clippy-outcome:
    description: Outcome of the cargo clippy gate (success, failure, or skipped when run-clippy is off).
    value: ${{ steps.clippy.outcome }}
  fmt-outcome:
    description: Outcome of the cargo fmt gate (success, failure, or skipped when run-fmt is off).
    value: ${{ steps.fmt.outcome }}
  test-outcome:
    description: Outcome of the cargo test gate (success, failure, or skipped when run-test is off).
    value: ${{ steps.test.outcome }}
  audit-outcome:
    description: Outcome of the cargo audit gate (success, failure, or skipped when run-audit is off).
    value: ${{ steps.audit.outcome }}

runs:
  using: composite
  steps:
    - name: Verify lockfile exists
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        . "${GITHUB_ACTION_PATH}/../scripts/github-workflow-io.sh"
        github_require_single_line working-directory "$WORKING_DIRECTORY"
        if [ ! -f "$WORKING_DIRECTORY/Cargo.lock" ]; then
          echo "::error::$(github_encode "$WORKING_DIRECTORY/Cargo.lock not found — refusing to build a cache key from a missing lockfile")" >&2
          exit 1
        fi

    # The fingerprint is `rustc -vV` plus the target list: target/ is useless to any other
    # compiler build, and matrix legs that differ only by target share one github.job.
    - name: Install Rust toolchain
      id: toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        RUN_CLIPPY: ${{ inputs.run-clippy }}
        RUN_FMT: ${{ inputs.run-fmt }}
      run: |
        want_components=$(printf '%s' "$COMPONENTS" | tr ' ' ',' | tr -s ',' | sed 's/^,//;s/,$//')
        want_targets=$(printf '%s' "$TARGETS" | tr ' ' ',' | tr -s ',' | sed 's/^,//;s/,$//')
        # rustup's default profile also downloads rust-docs, which no CI job reads.
        rustup set profile minimal
        if [ -z "$TOOLCHAIN" ] && { [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; }; then
          # With no name, rustup installs the toolchain file's channel, components and targets, but keeps an
          # existing install as it is: a runner image's preinstalled stable would set the rustc and the cache key.
          rustup toolchain install --no-self-update
          rustup update --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustc=(rustc)
          extra=()
        else
          rustup toolchain install "${TOOLCHAIN:-stable}" --no-self-update
          rustup default "${TOOLCHAIN:-stable}"
          rustc=(rustc "+${TOOLCHAIN:-stable}")
          extra=(--toolchain "${TOOLCHAIN:-stable}")
        fi
        # `component add` and `target add` with no --toolchain mean the rustup default. The
        # toolchain-file branch leaves extra empty, and cargo inside working-directory uses that
        # file's toolchain, which is not necessarily the default.
        if [ ${#extra[@]} -eq 0 ]; then
          gate_tc=(--toolchain "$(rustup show active-toolchain | cut -d' ' -f1)")
        else
          gate_tc=("${extra[@]}")
        fi
        if [ -n "$want_components" ]; then
          IFS=, read -ra list <<< "$want_components"
          rustup component add "${gate_tc[@]}" "${list[@]}"
        fi
        if [ -n "$want_targets" ]; then
          IFS=, read -ra list <<< "$want_targets"
          rustup target add "${gate_tc[@]}" "${list[@]}"
        fi
        gate_components=()
        if [ "$RUN_CLIPPY" = "true" ]; then
          gate_components+=(clippy)
        fi
        if [ "$RUN_FMT" = "true" ]; then
          gate_components+=(rustfmt)
        fi
        if [ ${#gate_components[@]} -gt 0 ]; then
          rustup component add "${gate_tc[@]}" "${gate_components[@]}"
        fi
        "${rustc[@]}" -V
        fingerprint=$(printf '%s\n%s\n' "$("${rustc[@]}" -vV)" "$want_targets" | git hash-object --stdin)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        {
          echo "SETUP_RUST_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          echo "SETUP_RUST_TARGET_DIR=${CARGO_TARGET_DIR:-$PWD/target}"
          # Incremental artifacts are large and never reused by a clean CI build; caching them
          # only slows the save. A caller that set it explicitly keeps its own value.
          if [ -z "${CARGO_INCREMENTAL:-}" ]; then
            echo "CARGO_INCREMENTAL=0"
          fi
        } >> "$GITHUB_ENV"

    # Saved in the post step, after the caller's cargo commands. The job id sits last in the key
    # so each job keeps its own profile (clippy, test and release builds do not share
    # artifacts). A lockfile change, or a job's first run, falls back to the newest cache of any
    # job for the same compiler and targets; a new rustc resets the prefix, which bounds how
    # much stale dependency output target/ can accumulate. registry/src is left out because
    # cargo re-extracts it from registry/cache. git/db is left out too: cargo keeps a git
    # dependency's remote URL there, and a URL with an embedded token would be uploaded.
    - name: Cache cargo registry and target
      id: cargo-cache
      if: github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.SETUP_RUST_CARGO_HOME }}/registry/index
          ${{ env.SETUP_RUST_CARGO_HOME }}/registry/cache
          ${{ env.SETUP_RUST_TARGET_DIR }}
        key: setup-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}-${{ github.job }}
        restore-keys: |
          setup-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}-
          setup-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-

    # continue-on-error so each gate step keeps its own warning icon and the gate
    # below is what fails the job, matching setup-go. The summary is a pass/fail
    # table, not a parsed clippy or rustfmt report.
    - name: cargo clippy
      id: clippy
      if: inputs.run-clippy == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: cargo fmt
      id: fmt
      if: inputs.run-fmt == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo fmt --all -- --check

    - name: cargo test
      id: test
      if: inputs.run-test == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo test --locked --all-targets

    # Not continue-on-error: a failed download or checksum mismatch is an infrastructure
    # failure, and must not be reported by the gate below as an advisory. rustsec publishes no
    # checksums file, so the digests are pinned here, taken from the release asset digests;
    # bumping CARGO_AUDIT_VERSION means replacing all four.
    - name: Install cargo-audit
      id: audit-install
      if: inputs.run-audit == 'true'
      shell: bash
      env:
        OS_NAME: ${{ runner.os }}
        ARCH_NAME: ${{ runner.arch }}
      run: |
        set -u
        . "${GITHUB_ACTION_PATH}/../scripts/github-workflow-io.sh"
        version=0.22.2
        case "$OS_NAME/$ARCH_NAME" in
          Linux/X64)
            target=x86_64-unknown-linux-musl
            sha256=7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428 ;;
          Linux/ARM64)
            target=aarch64-unknown-linux-gnu
            sha256=c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd ;;
          macOS/X64)
            target=x86_64-apple-darwin
            sha256=847831323de932155b226ab60ee4a180e13e5d007a019f0d4b7b4d89a6de2ab2 ;;
          macOS/ARM64)
            target=aarch64-apple-darwin
            sha256=ec7ca4263769593df4d909be85b94a6b79efa2897be5d2bb8ebd516e823175af ;;
          *)
            echo "::error::$(github_encode "run-audit has no cargo-audit release for $OS_NAME $ARCH_NAME runners")" >&2
            exit 1 ;;
        esac
        base="cargo-audit-$target-v$version"
        dir="$RUNNER_TEMP/setup-rust-cargo-audit"
        mkdir -p "$dir"
        cd "$dir" || exit 1
        curl -fsSL --max-time 60 --retry 5 --retry-all-errors --retry-max-time 120 -o "$base.tgz" \
          "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv$version/$base.tgz"
        echo "$sha256  $base.tgz" | shasum -a 256 -c -
        tar -xzf "$base.tgz"
        echo "bin=$dir/$base/cargo-audit" >> "$GITHUB_OUTPUT"

    - name: cargo audit
      id: audit
      if: inputs.run-audit == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CARGO_AUDIT: ${{ steps.audit-install.outputs.bin }}
      run: '"$CARGO_AUDIT" audit'

    - name: Gate on clippy, fmt, test, and audit results
      if: inputs.run-clippy == 'true' || inputs.run-fmt == 'true' || inputs.run-test == 'true' || inputs.run-audit == 'true'
      shell: bash
      env:
        RUN_CLIPPY: ${{ inputs.run-clippy }}
        RUN_FMT: ${{ inputs.run-fmt }}
        RUN_TEST: ${{ inputs.run-test }}
        RUN_AUDIT: ${{ inputs.run-audit }}
        CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        TEST_OUTCOME: ${{ steps.test.outcome }}
        AUDIT_OUTCOME: ${{ steps.audit.outcome }}
      run: |
        row() {
          local enabled="$1" outcome="$2" label="$3"
          if [ "$enabled" != 'true' ]; then
            echo "| $label | — not run |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$outcome" = "failure" ]; then
            echo "| $label | ❌ fail |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| $label | ✅ pass |" >> "$GITHUB_STEP_SUMMARY"
          fi
        }
        {
          echo "## setup-rust clippy/fmt/test/audit gate"
          echo "| Check | Result |"
          echo "| --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"
        row "$RUN_CLIPPY" "$CLIPPY_OUTCOME" "cargo clippy"
        row "$RUN_FMT" "$FMT_OUTCOME" "cargo fmt --all -- --check"
        row "$RUN_TEST" "$TEST_OUTCOME" "cargo test --locked --all-targets"
        row "$RUN_AUDIT" "$AUDIT_OUTCOME" "cargo audit"

        failed=0
        if [ "$CLIPPY_OUTCOME" = "failure" ]; then
          echo "::error::cargo clippy found issues — see the cargo clippy step above" >&2
          failed=1
        fi
        if [ "$FMT_OUTCOME" = "failure" ]; then
          echo "::error::cargo fmt --all -- --check found unformatted files — see the cargo fmt step above" >&2
          failed=1
        fi
        if [ "$TEST_OUTCOME" = "failure" ]; then
          echo "::error::cargo test --locked --all-targets failed — see the cargo test step above" >&2
          failed=1
        fi
        if [ "$AUDIT_OUTCOME" = "failure" ]; then
          echo "::error::cargo audit found vulnerabilities — see the cargo audit step above" >&2
          failed=1
        fi
        exit "$failed"
