# CI's audit-bun job runs this unit test from the repo root; detection finds no package.json there to read it from.
[gates.audit-bun]
run = "bun test audit-bun"

# CI asserts the shared actions fail on these two fixtures, so they are broken on purpose and gate leaves them out.
[detect]
exclude = ["python-app-broken", "python-app-unformatted"]
