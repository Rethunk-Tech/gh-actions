# CI's audit-bun job runs this unit test from the repo root; detection finds no package.json there to read it from.
[gates.audit-bun]
run = "bun test audit-bun"

# CI's lint job runs this. It is not a language tool, so detection never sees it.
[gates.setup-bun-drift]
run = "python3 scripts/check-setup-bun-drift.py"

# CI asserts the shared actions fail on these fixtures, so they are broken on purpose and gate leaves them out.
[detect]
exclude = [
  "go-app-failing",
  "python-app-broken",
  "python-app-failing",
  "python-app-unformatted",
  "rust-app-failing",
  "bun-app-failing",
]
