# CI's audit-bun job runs this unit test from the repo root; detection finds no package.json there to read it from.
[gates.audit-bun]
run = "bun test audit-bun"

# CI's lint job runs this. It is not a language tool, so detection never sees it.
[gates.setup-bun-drift]
run = "python3 -m unittest discover -s scripts -p 'test_*.py' -v && python3 scripts/check-setup-bun-drift.py"

# Same three lint-job checks as .github/workflows/ci.yml. Detection never sees them.
[gates.action-yml-schema]
run = '''
bash -s <<'EOF'
shopt -s nullglob
files=(*/action.yml)
if [ ${#files[@]} -eq 0 ]; then
  echo "::error::no action.yml files found at */action.yml" >&2
  exit 1
fi
uvx check-jsonschema --builtin-schema vendor.github-actions "${files[@]}"
EOF
'''

[gates.declared-inputs]
run = '''
python3 - <<'PY'
import re, sys, pathlib
bad = False
for f in sorted(pathlib.Path(".").glob("*/action.yml")):
    t = f.read_text()
    m = re.search(r"^inputs:\n(.*?)^(?=\w)", t, re.S | re.M)
    declared = set(re.findall(r"^  ([\w-]+):", m.group(1), re.M)) if m else set()
    for name in sorted(set(re.findall(r"inputs\.([\w-]+)", t)) - declared):
        print(f"::error file={f}::references undeclared input '{name}'")
        bad = True
sys.exit(1 if bad else 0)
PY
'''

[gates.fixtures-tracked]
run = '''
bad=0
for d in .github/test-fixtures/*/; do
  if [ -z "$(git ls-files "$d")" ]; then
    echo "::error file=.gitignore::fixture '$d' has no tracked files — it is gitignored, so CI will never see it" >&2
    bad=1
  fi
done
exit "$bad"
'''

# Same expected-failure as test-setup-bun-test-fail: bun test must fail.
[gates.bun-app-failing]
run = '''
cd .github/test-fixtures/bun-app-failing
if bun test; then
  echo "::error::expected bun test to fail on bun-app-failing" >&2
  exit 1
fi
'''

# Same expected-failure as test-setup-go-test-fail: go test ./... must fail.
[gates.go-app-failing]
run = '''
cd .github/test-fixtures/go-app-failing
if go test ./...; then
  echo "::error::expected go test ./... to fail on go-app-failing" >&2
  exit 1
fi
'''

# Same expected-failure as test-setup-go-govulncheck-fail: govulncheck must report an advisory.
[gates.go-app-vulnerable]
run = '''
cd .github/test-fixtures/go-app-vulnerable
output=$(govulncheck ./... 2>&1) || true
printf '%s\n' "$output"
if printf '%s\n' "$output" | grep -qE 'GO-[0-9]+-[0-9]+'; then
  exit 0
fi
echo "::error::expected govulncheck to report an advisory on go-app-vulnerable" >&2
exit 1
'''

# Same expected-failure as test-setup-python-test-fail: pytest must fail.
[gates.python-app-failing]
run = '''
cd .github/test-fixtures/python-app-failing
if uv run --locked --group dev pytest; then
  echo "::error::expected pytest to fail on python-app-failing" >&2
  exit 1
fi
'''

# Same expected-failure as test-setup-python-audit-fail: uv audit must report jinja2.
[gates.python-app-vulnerable]
run = '''
cd .github/test-fixtures/python-app-vulnerable
output=$(uv audit --locked 2>&1) || true
printf '%s\n' "$output"
if printf '%s\n' "$output" | grep -qi jinja2; then
  exit 0
fi
echo "::error::expected uv audit to report an advisory on python-app-vulnerable" >&2
exit 1
'''

# Same expected-failure as test-setup-rust-test-catches-failure: cargo test must fail.
[gates.rust-app-failing]
run = '''
cd .github/test-fixtures/rust-app-failing
if cargo test --locked --all-targets; then
  echo "::error::expected cargo test to fail on rust-app-failing" >&2
  exit 1
fi
'''

# python-app-broken / python-app-unformatted stay CI-only: those jobs assert composite
# ruff/format outcomes on a GitHub runner, not a command gate can invert locally.
# rust-app-vulnerable stays CI-only: cargo audit is not in the local rust detect
# chain (build/clippy/test) and is not installed here; CI asserts setup-rust
# run-audit on a runner.
# The failing/vulnerable fixtures gated above stay excluded so detect does not
# also run the success-path checks on trees that fail by design.
[detect]
exclude = [
  "go-app-failing",
  "go-app-vulnerable",
  "python-app-broken",
  "python-app-failing",
  "python-app-unformatted",
  "python-app-vulnerable",
  "rust-app-failing",
  "rust-app-vulnerable",
  "bun-app-failing",
]
