name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (schema + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./setup-python
        with:
          working-directory: .github
          skip-install: "true"

      # actionlint parses any file it's pointed at as a workflow — it cannot validate a
      # composite action.yml (throws bogus structural errors). Schema-validate those
      # separately; actionlint below is scoped to .github/workflows/*.yml only.
      - name: Schema-validate action.yml files
        if: ${{ !cancelled() }}
        run: |
          # Glob, not a hardcoded list: a new action directory that never gets added here
          # would otherwise ship schema-invalid. The undeclared-input check below already globs.
          shopt -s nullglob
          files=(*/action.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no action.yml files found at */action.yml" >&2
            exit 1
          fi
          uvx check-jsonschema --builtin-schema vendor.github-actions "${files[@]}"

      # Neither check above can see this: an `inputs.foo` that was never declared resolves to
      # the empty string rather than erroring, so a step gated on one silently never runs.
      # That shipped once, in setup-bun's extra-paths cache.
      - name: Check every referenced input is declared
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          bad = False
          for f in sorted(pathlib.Path(".").glob("*/action.yml")):
              t = f.read_text()
              m = re.search(r"^inputs:\n(.*?)^(?=\w)", t, re.S | re.M)
              declared = set(re.findall(r"^  ([\w-]+):", m.group(1), re.M)) if m else set()
              for name in sorted(set(re.findall(r"inputs\.([\w-]+)", t)) - declared):
                  print(f"::error file={f}::references undeclared input '{name}'")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF

      # setup-nextjs-bun duplicates setup-bun's shared steps instead of composing them
      # (actions/runner#2009). Fail when those steps diverge without an exception in the script.
      - name: Check setup-bun and setup-nextjs-bun shared steps
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v && python3 scripts/check-setup-bun-drift.py

      # A fixture directory silently excluded by .gitignore never reaches CI's checkout, so the
      # self-test that uses it fails at "action can't find its fixture" while its outcome
      # assertion still reads as the gate firing. That shipped once: `**/*-broken` matched the
      # *-broken fixture directories themselves, not just the compiled binaries it was written
      # for, and only an act run surfaced it. Untracked fixture, tracked failure.
      - name: Check every test fixture is actually tracked
        if: ${{ !cancelled() }}
        run: |
          bad=0
          for d in .github/test-fixtures/*/; do
            if [ -z "$(git ls-files "$d")" ]; then
              echo "::error file=.gitignore::fixture '$d' has no tracked files — it is gitignored, so CI will never see it" >&2
              bad=1
            fi
          done
          exit "$bad"

      - name: Install actionlint
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --max-time 60 --retry 5 --retry-all-errors -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar xz -f actionlint.tar.gz actionlint

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: ./actionlint .github/workflows/*.yml

  # actions/cache persists ACROSS separate workflow runs on the same ref (GitHub's real cache
  # backend, not act's throwaway local one) — a cold-cache job only sees a genuine miss on the
  # very first run against a given fixture's lockfile; every later push whose fixture didn't
  # change would incorrectly restore the previous run's cache. Found via a real GitHub-hosted
  # run, not local `act` testing (which resets its cache-server-path per invocation and can't
  # surface this). Fix: wipe both self-test cache prefixes for this ref in one serial job
  # before either -cold job starts, so there's no window for a race between the two fixtures'
  # deletes and saves.
  reset-self-test-caches:
    name: Reset self-test caches (ensure genuinely cold)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Delete every self-test cache prefix for this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --ref cannot be combined with a numeric cache ID (only with a key string). IDs are
          # already unambiguous, so no --ref is needed on the delete call itself.
          prefixes='Linux-bun- Linux-nextjs- setup-go-Linux- setup-go-lint- setup-rust- playwright-Linux- Linux-bun-extra- setup-uv-'

          # A single transient 5xx from the cache API must not abort this step: warm caches would
          # make every cold-cache assertion downstream fail for the wrong reason.
          # Retry each delete, then verify emptiness: a cache that genuinely survives still
          # fails the job, which is what keeps the cold assertions meaningful.
          for attempt in 1 2 3; do
            for prefix in $prefixes; do
              for id in $(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --json id -q '.[].id'); do
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
              done
            done
            remaining=0
            for prefix in $prefixes; do
              n=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --json id -q '.[].id' | wc -l)
              remaining=$((remaining + n))
            done
            [ "$remaining" -eq 0 ] && break
            echo "cache delete attempt $attempt left $remaining cache(s); retrying" >&2
            sleep $((attempt * 5))
          done

          if [ "$remaining" -ne 0 ]; then
            echo "::error::$remaining self-test cache(s) survived deletion; cold-cache assertions would be meaningless" >&2
            exit 1
          fi

  # Each action gets a cold-cache job (proves install works, no exact cache hit) followed by
  # a warm-cache job (needs: <cold job>, so it only starts after the cold job's cache save
  # completed — this is what actually proves cache-hit == 'true' on the second run, since
  # actions/cache saves in a post step that a same-job second invocation would never see in
  # time). setup-bun and setup-nextjs-bun use separate fixtures with different lockfile
  # content, so their exact cache KEYS never collide. Cold assertions check != 'true' rather
  # than emptiness, so an action that does use restore-keys (setup-go) can legitimately
  # partial-match another fixture's parallel save — a stale EXACT match surviving the reset
  # job still fails. A job that uses the same fixture as a cold job must wait for that job:
  # both keys are `<os>-bun-<packageManager>-<lock hash>`, and the sibling's post-step save
  # is an exact hit if it lands first. Reset already deletes that prefix; the miss is lost
  # inside the run.
  test-setup-bun-cold:
    name: setup-bun self-test (cold cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
      - name: assert deps installed and no exact cache hit
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
        run: |
          test -d .github/test-fixtures/bun-app/node_modules/is-odd
          if [ "$AUDIT" != "skipped" ]; then
            echo "::error::expected audit-outcome=skipped when run-audit is off, got '$AUDIT'" >&2
            exit 1
          fi
          if [ "$TEST" != "skipped" ]; then
            echo "::error::expected test-outcome=skipped when run-test is off, got '$TEST'" >&2
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-bun-warm:
    name: setup-bun self-test (warm cache)
    needs: test-setup-bun-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
      - name: assert cache-hit true
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  # The extra-paths cache is the one cache in this action whose inputs are supplied entirely
  # by the caller, so a self-test is the only thing that proves the wiring resolves at all —
  # the three inputs it reads went undeclared for the life of the feature, which schema
  # validation cannot catch (a reference to an undeclared input is empty, not invalid) and
  # actionlint does not check for composite actions. Cold writes a marker into the extra path
  # and lets the post step save it; warm asserts the marker came back. Needs the install-store
  # cold job: this fixture's post step would otherwise publish that job's exact key first.
  test-setup-bun-extra-cache-cold:
    name: setup-bun self-test (extra-paths cache, cold)
    needs: test-setup-bun-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          extra-cache-paths: .turbo-selftest
          extra-cache-key: ${{ github.sha }}
      - name: write the marker the warm job has to see
        run: |
          mkdir -p .turbo-selftest
          echo "$GITHUB_SHA" > .turbo-selftest/marker

  test-setup-bun-extra-cache-warm:
    name: setup-bun self-test (extra-paths cache, warm)
    needs: test-setup-bun-extra-cache-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          extra-cache-paths: .turbo-selftest
          extra-cache-key: ${{ github.sha }}
      - name: assert the extra path was restored
        run: |
          if [ ! -f .turbo-selftest/marker ]; then
            echo "::error::extra-cache-paths did not restore .turbo-selftest/marker" >&2
            exit 1
          fi
          if [ "$(cat .turbo-selftest/marker)" != "$GITHUB_SHA" ]; then
            echo "::error::restored marker is not this run's, got '$(cat .turbo-selftest/marker)'" >&2
            exit 1
          fi

  # skip-install must skip the install, not the install-store cache: its documented
  # callers run `bun install` themselves after some other setup step and still want the
  # cache. Chained off the warm job so the key is known to exist — before the fix this
  # step was gated off entirely and cache-hit came back empty.
  test-setup-bun-skip-install-cache:
    name: setup-bun self-test (skip-install still caches)
    needs: test-setup-bun-warm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          skip-install: "true"
      - name: assert the store was cached and the install was still skipped
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::skip-install must not disable the install-store cache; expected cache-hit=true after the warm job, got '$CACHE_HIT'" >&2
            exit 1
          fi
          if [ -d .github/test-fixtures/bun-app/node_modules ]; then
            echo "::error::skip-install ran bun install anyway" >&2
            exit 1
          fi

  # The genuinely project-less case: bun as a PATH tool, no bun.lock anywhere. Must not
  # error on the missing lockfile — repo-ops calls exactly this.
  test-setup-bun-skip-install-no-lockfile:
    name: setup-bun self-test (skip-install, no project)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-bun
        with:
          working-directory: .github
          skip-install: "true"
      - run: bun --version

  test-setup-bun-audit-pass:
    name: setup-bun self-test (audit gate, clean fixture)
    needs: test-setup-bun-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          run-audit: "true"
      - name: assert the audit gate passed
        env:
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$AUDIT" != "success" ]; then
            echo "::error::expected audit-outcome=success on the clean fixture, got '$AUDIT'" >&2
            exit 1
          fi

  # Proves the run-audit gate fires: lodash 4.17.20 has a shipped fix, so the shared
  # audit-bun auditor fails. The same fixture is what audit-bun's own self-test uses.
  test-setup-bun-audit-fail:
    name: setup-bun self-test (audit gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-vulnerable
          run-audit: "true"
      - name: assert the audit gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$AUDIT" != "failure" ]; then
            echo "::error::expected the audit gate to fail on a fixable advisory, got composite '$OUTCOME', audit '$AUDIT'" >&2
            exit 1
          fi

  # skip-install + run-audit: bun audit reads the lockfile. The vulnerable fixture is the
  # assertion that the audit step actually ran: a skipped step's outcome is not "failure",
  # and the gate treats a skipped outcome as pass.
  test-setup-bun-skip-install-audit:
    name: setup-bun self-test (skip-install still audits)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-vulnerable
          skip-install: "true"
          run-audit: "true"
      - name: assert skip-install still failed the audit gate
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$AUDIT" != "failure" ]; then
            echo "::error::skip-install gated or skipped bun audit; expected composite failure and audit-outcome=failure, got composite '$OUTCOME', audit '$AUDIT'" >&2
            exit 1
          fi

  test-setup-bun-test-pass:
    name: setup-bun self-test (test gate, clean fixture)
    needs: test-setup-bun-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          run-test: "true"
      - name: assert the test gate passed and audit stayed off
        env:
          TEST: ${{ steps.setup.outputs.test-outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$TEST" != "success" ] || [ "$AUDIT" != "skipped" ]; then
            echo "::error::expected test-outcome=success and audit-outcome=skipped, got test '$TEST', audit '$AUDIT'" >&2
            exit 1
          fi

  # Proves the run-test gate fires: the fixture's only test assertion fails.
  test-setup-bun-test-fail:
    name: setup-bun self-test (test gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-failing
          run-test: "true"
      - name: assert the test gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$TEST" != "failure" ] || [ "$AUDIT" != "skipped" ]; then
            echo "::error::expected the test gate to fail and audit to stay off, got composite '$OUTCOME', test '$TEST', audit '$AUDIT'" >&2
            exit 1
          fi

  test-setup-nextjs-bun-cold:
    name: setup-nextjs-bun self-test (cold cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app
      - name: assert deps installed and no exact cache hit
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          test -d .github/test-fixtures/nextjs-app/node_modules/is-even
          if [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-nextjs-bun-warm:
    name: setup-nextjs-bun self-test (warm cache)
    needs: test-setup-nextjs-bun-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app
      - name: assert cache-hit true
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  # next-app-directory must restore under the app dir, not the working-directory root.
  test-setup-nextjs-bun-next-app-dir-cold:
    name: setup-nextjs-bun self-test (next-app-directory cache, cold)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-workspace
          next-app-directory: .github/test-fixtures/nextjs-workspace/apps/web
      - name: write the marker the warm job has to see
        run: |
          mkdir -p .github/test-fixtures/nextjs-workspace/apps/web/.next/cache
          echo "$GITHUB_SHA" > .github/test-fixtures/nextjs-workspace/apps/web/.next/cache/marker

  test-setup-nextjs-bun-next-app-dir-warm:
    name: setup-nextjs-bun self-test (next-app-directory cache, warm)
    needs:
      - reset-self-test-caches
      - test-setup-nextjs-bun-next-app-dir-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-workspace
          next-app-directory: .github/test-fixtures/nextjs-workspace/apps/web
      - name: assert the marker restored under the app dir
        run: |
          if [ ! -f .github/test-fixtures/nextjs-workspace/apps/web/.next/cache/marker ]; then
            echo "::error::next-app-directory did not restore apps/web/.next/cache/marker" >&2
            exit 1
          fi
          if [ "$(cat .github/test-fixtures/nextjs-workspace/apps/web/.next/cache/marker)" != "$GITHUB_SHA" ]; then
            echo "::error::restored marker is not this run's, got '$(cat .github/test-fixtures/nextjs-workspace/apps/web/.next/cache/marker)'" >&2
            exit 1
          fi
          if [ -f .github/test-fixtures/nextjs-workspace/.next/cache/marker ]; then
            echo "::error::next-app-directory restored under working-directory/.next/cache instead of the app dir" >&2
            exit 1
          fi

  # Distinct extra-cache-key so these jobs cannot collide with the bun extra-cache pair.
  # Needs the install-store cold job: same fixture, so this post step publishes that exact key.
  test-setup-nextjs-bun-extra-cache-cold:
    name: setup-nextjs-bun self-test (extra-paths cache, cold)
    needs: test-setup-nextjs-bun-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app
          extra-cache-paths: .turbo-selftest-nextjs
          extra-cache-key: ${{ github.sha }}-nextjs
      - name: write the marker the warm job has to see
        run: |
          mkdir -p .turbo-selftest-nextjs
          echo "$GITHUB_SHA" > .turbo-selftest-nextjs/marker

  test-setup-nextjs-bun-extra-cache-warm:
    name: setup-nextjs-bun self-test (extra-paths cache, warm)
    needs: test-setup-nextjs-bun-extra-cache-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app
          extra-cache-paths: .turbo-selftest-nextjs
          extra-cache-key: ${{ github.sha }}-nextjs
      - name: assert the extra path was restored
        run: |
          if [ ! -f .turbo-selftest-nextjs/marker ]; then
            echo "::error::extra-cache-paths did not restore .turbo-selftest-nextjs/marker" >&2
            exit 1
          fi
          if [ "$(cat .turbo-selftest-nextjs/marker)" != "$GITHUB_SHA" ]; then
            echo "::error::restored marker is not this run's, got '$(cat .turbo-selftest-nextjs/marker)'" >&2
            exit 1
          fi

  # Distinct Playwright version (1.55.1) so playwright-${{ runner.os }}-${version} keys do not
  # collide with setup-bun's 1.64.1 fixture: sharing one version would make a parallel
  # cold pair race one cache key.
  test-setup-nextjs-bun-playwright-cold:
    name: setup-nextjs-bun self-test (Playwright cache, cold)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app-playwright
          install-playwright: "true"
          playwright-browsers: chromium
      - name: assert browser installed and no exact cache hit
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
          PW_VERSION: ${{ steps.setup.outputs.playwright-version }}
        run: |
          if [ ! -d ~/.cache/ms-playwright ] || [ -z "$(ls -A ~/.cache/ms-playwright)" ]; then
            echo "::error::expected Playwright browsers installed under ~/.cache/ms-playwright" >&2
            exit 1
          fi
          if [ "$PW_VERSION" != "1.55.1" ]; then
            echo "::error::expected playwright-version=1.55.1 (distinct from setup-bun's 1.64.1 fixture so the cache keys cannot collide), got '$PW_VERSION'" >&2
            exit 1
          fi
          if [ "$PW_CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact Playwright cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-nextjs-bun-playwright-warm:
    name: setup-nextjs-bun self-test (Playwright cache, warm)
    needs: test-setup-nextjs-bun-playwright-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app-playwright
          install-playwright: "true"
          playwright-browsers: chromium
      - name: assert Playwright cache-hit true
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" != "true" ]; then
            echo "::error::expected Playwright cache-hit=true on warm run, got '$PW_CACHE_HIT'" >&2
            exit 1
          fi
      # The system-deps step skips a font-only gap, so prove Chromium still launches without it.
      - name: assert Chromium launches
        working-directory: .github/test-fixtures/nextjs-app-playwright
        run: node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"

  # setup-go keys its cache on github.job, so a cold job and a separate warm job could never
  # share an exact key. One job id with two matrix legs does: max-parallel 1 runs them in
  # declared order, and the cold leg's post-step save lands before the warm leg starts.
  test-setup-go-cache:
    name: setup-go self-test (${{ matrix.phase }} cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        phase: [cold, warm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app/go.mod
          run-test-race: "true"
      - name: assert build works after the race gate and cache hit matches the phase
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
          PHASE: ${{ matrix.phase }}
        working-directory: .github/test-fixtures/go-app
        run: |
          go build ./...
          if [ "$TEST" != "skipped" ]; then
            echo "::error::expected test-outcome=skipped when run-test is off, got '$TEST'" >&2
            exit 1
          fi
          if [ "$PHASE" = "cold" ] && [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi
          if [ "$PHASE" = "warm" ] && [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  # Same one-job, two-leg shape as test-setup-go-cache: setup-rust also keys on github.job.
  # The fixture's rust-toolchain.toml names clippy, so clippy running proves the toolchain-file
  # path installed its components.
  test-setup-rust-cache:
    name: setup-rust self-test (${{ matrix.phase }} cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        phase: [cold, warm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-rust
        with:
          working-directory: .github/test-fixtures/rust-app
      - name: assert clippy and build work and the cache hit matches the phase
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          CLIPPY: ${{ steps.setup.outputs.clippy-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
          PHASE: ${{ matrix.phase }}
        working-directory: .github/test-fixtures/rust-app
        run: |
          cargo clippy --locked -- -D warnings
          cargo build --locked
          if [ "$CLIPPY" != "skipped" ]; then
            echo "::error::expected clippy-outcome=skipped when run-clippy is off, got '$CLIPPY'" >&2
            exit 1
          fi
          if [ "$FMT" != "skipped" ]; then
            echo "::error::expected fmt-outcome=skipped when run-fmt is off, got '$FMT'" >&2
            exit 1
          fi
          if [ "$TEST" != "skipped" ]; then
            echo "::error::expected test-outcome=skipped when run-test is off, got '$TEST'" >&2
            exit 1
          fi
          if [ "$PHASE" = "cold" ] && [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi
          if [ "$PHASE" = "warm" ] && [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  # A wrong working-directory used to share one empty hashFiles() cache key with every other
  # missing-lockfile caller. Fail closed, matching setup-bun's missing bun.lock.
  test-setup-rust-no-lockfile:
    name: setup-rust self-test (missing Cargo.lock fails)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-rust
        continue-on-error: true
        with:
          working-directory: .github
      - name: assert a missing Cargo.lock fails the action
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected setup-rust to fail without Cargo.lock, got '$OUTCOME'" >&2
            exit 1
          fi

  # heft's shape: an explicit toolchain with extra components and a cross target, in a
  # directory whose rust-toolchain.toml would otherwise decide.
  test-setup-rust-toolchain-input:
    name: setup-rust self-test (explicit toolchain, components, targets)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-rust
        with:
          working-directory: .github/test-fixtures/rust-app
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: assert the components and target were installed
        env:
          CLIPPY: ${{ steps.setup.outputs.clippy-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
        working-directory: .github/test-fixtures/rust-app
        run: |
          cargo +stable fmt --check
          rustup target list --installed --toolchain stable | grep -qx x86_64-unknown-linux-musl
          cargo +stable check --locked --target x86_64-unknown-linux-musl
          if [ "$CLIPPY" != "skipped" ]; then
            echo "::error::expected clippy-outcome=skipped when run-clippy is off, got '$CLIPPY'" >&2
            exit 1
          fi
          if [ "$FMT" != "skipped" ]; then
            echo "::error::expected fmt-outcome=skipped when run-fmt is off, got '$FMT'" >&2
            exit 1
          fi
          if [ "$TEST" != "skipped" ]; then
            echo "::error::expected test-outcome=skipped when run-test is off, got '$TEST'" >&2
            exit 1
          fi

  test-setup-rust-clippy-pass:
    name: setup-rust self-test (clippy + fmt + test gates, clean fixture)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-rust
        with:
          working-directory: .github/test-fixtures/rust-app
          run-clippy: "true"
          run-fmt: "true"
          run-test: "true"
      - name: assert the clippy, fmt, and test gates passed
        env:
          CLIPPY: ${{ steps.setup.outputs.clippy-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
        run: |
          if [ "$CLIPPY" != "success" ] || [ "$FMT" != "success" ] || [ "$TEST" != "success" ]; then
            echo "::error::expected clippy, fmt, and test outcomes success on the clean fixture, got clippy '$CLIPPY', fmt '$FMT', test '$TEST'" >&2
            exit 1
          fi

  # Proves the clippy gate fires rather than no-op'ing. The fixture builds and `cargo clippy`
  # without `-D warnings` exits 0; only the gate's command fails, on clippy::len_zero.
  test-setup-rust-clippy-catches-real-issue:
    name: setup-rust self-test (clippy gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-rust
        with:
          working-directory: .github/test-fixtures/rust-app-broken
          toolchain: stable
          run-clippy: "true"
      - name: assert the clippy gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          CLIPPY: ${{ steps.setup.outputs.clippy-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$CLIPPY" != "failure" ]; then
            echo "::error::expected the clippy gate to fail on a known-bad fixture, got composite '$OUTCOME', clippy '$CLIPPY'" >&2
            exit 1
          fi

  # Proves the run-fmt gate fires: a fixture that is clippy-clean but not rustfmt-formatted.
  test-setup-rust-fmt-catches-unformatted:
    name: setup-rust self-test (fmt gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-rust
        with:
          working-directory: .github/test-fixtures/rust-app-unformatted
          run-clippy: "true"
          run-fmt: "true"
      - name: assert only the format gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          CLIPPY: ${{ steps.setup.outputs.clippy-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$FMT" != "failure" ] || [ "$CLIPPY" != "success" ]; then
            echo "::error::expected cargo clippy to pass and cargo fmt to fail, got composite '$OUTCOME', clippy '$CLIPPY', fmt '$FMT'" >&2
            exit 1
          fi

  # Proves the run-test gate fires: the fixture is clippy-clean and rustfmt-clean, and one test panics.
  test-setup-rust-test-catches-failure:
    name: setup-rust self-test (test gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-rust
        with:
          working-directory: .github/test-fixtures/rust-app-failing
          run-clippy: "true"
          run-fmt: "true"
          run-test: "true"
      - name: assert only the test gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          CLIPPY: ${{ steps.setup.outputs.clippy-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$TEST" != "failure" ] || [ "$CLIPPY" != "success" ] || [ "$FMT" != "success" ]; then
            echo "::error::expected cargo test to fail and clippy and fmt to pass, got composite '$OUTCOME', clippy '$CLIPPY', fmt '$FMT', test '$TEST'" >&2
            exit 1
          fi

  # audit-bun fails only on an advisory with a shipped fix. The pure split (fixable vs no patched
  # release) is unit-tested; the fixture proves the gate fires on a real, fixable advisory
  # (lodash 4.17.20) and stays quiet on a clean tree.
  test-audit-bun:
    name: audit-bun self-test (unit tests, fixable fails, clean passes)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-vulnerable
      - run: bun test audit-bun
      - id: fixable
        uses: ./audit-bun
        continue-on-error: true
        with:
          working-directory: .github/test-fixtures/bun-app-vulnerable
      - name: assert the fixable advisory failed the audit
        env:
          OUTCOME: ${{ steps.fixable.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::audit-bun outcome was '$OUTCOME' on a fixable advisory, expected failure" >&2
            exit 1
          fi
      - uses: ./audit-bun
        with:
          working-directory: .github/test-fixtures/bun-app

  test-setup-bun-playwright-cold:
    name: setup-bun self-test (Playwright cache, cold)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-playwright
          install-playwright: "true"
          playwright-browsers: chromium
      - name: assert browser installed and no exact cache hit
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
          PW_VERSION: ${{ steps.setup.outputs.playwright-version }}
        run: |
          if [ ! -d ~/.cache/ms-playwright ] || [ -z "$(ls -A ~/.cache/ms-playwright)" ]; then
            echo "::error::expected Playwright browsers installed under ~/.cache/ms-playwright" >&2
            exit 1
          fi
          if [ "$PW_VERSION" != "1.64.1" ]; then
            echo "::error::expected playwright-version=1.64.1, got '$PW_VERSION'" >&2
            exit 1
          fi
          if [ "$PW_CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact Playwright cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-bun-playwright-warm:
    name: setup-bun self-test (Playwright cache, warm)
    needs: test-setup-bun-playwright-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-playwright
          install-playwright: "true"
          playwright-browsers: chromium
      - name: assert Playwright cache-hit true
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" != "true" ]; then
            echo "::error::expected Playwright cache-hit=true on warm run, got '$PW_CACHE_HIT'" >&2
            exit 1
          fi
      # The system-deps step skips a font-only gap, so prove Chromium still launches without it.
      - name: assert Chromium launches
        working-directory: .github/test-fixtures/bun-app-playwright
        run: node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"

  # playwright-directory is the Bastion/caldera/prepaudit shape: bun.lock (and skip-install) at
  # the workspace root, @playwright/test pinned only under apps/web. Resolving against the root
  # package.json would cache as "unpinned" and never invalidate on a browser bump. Distinct
  # 1.52.0 so this pair cannot collide with the 1.64.1 / 1.55.1 Playwright self-tests.
  test-setup-bun-playwright-directory-cold:
    name: setup-bun self-test (playwright-directory, skip-install, cold)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-workspace-playwright
          skip-install: "true"
          install-playwright: "true"
          playwright-directory: .github/test-fixtures/bun-workspace-playwright/apps/web
          playwright-browsers: chromium
      - name: assert pin came from apps/web and the root install was skipped
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
          PW_VERSION: ${{ steps.setup.outputs.playwright-version }}
        run: |
          if [ "$PW_VERSION" != "1.52.0" ]; then
            echo "::error::expected playwright-version=1.52.0 from apps/web, got '$PW_VERSION' (unpinned means it read the root package.json)" >&2
            exit 1
          fi
          if [ -d .github/test-fixtures/bun-workspace-playwright/node_modules ]; then
            echo "::error::skip-install ran bun install at the workspace root anyway" >&2
            exit 1
          fi
          if [ ! -d ~/.cache/ms-playwright ] || [ -z "$(ls -A ~/.cache/ms-playwright)" ]; then
            echo "::error::expected Playwright browsers installed under ~/.cache/ms-playwright" >&2
            exit 1
          fi
          if [ "$PW_CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact Playwright cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-bun-playwright-directory-warm:
    name: setup-bun self-test (playwright-directory, skip-install, warm)
    needs: test-setup-bun-playwright-directory-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-workspace-playwright
          skip-install: "true"
          install-playwright: "true"
          playwright-directory: .github/test-fixtures/bun-workspace-playwright/apps/web
          playwright-browsers: chromium
      - name: assert Playwright cache-hit true and the pin still came from apps/web
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
          PW_VERSION: ${{ steps.setup.outputs.playwright-version }}
        run: |
          if [ "$PW_VERSION" != "1.52.0" ]; then
            echo "::error::expected playwright-version=1.52.0 from apps/web, got '$PW_VERSION'" >&2
            exit 1
          fi
          if [ "$PW_CACHE_HIT" != "true" ]; then
            echo "::error::expected Playwright cache-hit=true on warm run, got '$PW_CACHE_HIT'" >&2
            exit 1
          fi

  test-setup-go-lint-vuln-pass:
    name: setup-go self-test (lint + fmt + govulncheck, clean fixture)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app/go.mod
          run-lint: "true"
          run-fmt: "true"
          run-govulncheck: "true"

  # Proves the govulncheck gate fires: jwt v4.5.0 has shipped fixes, so a call to jwt.Parse
  # fails govulncheck. Other gates stay off so only this one can produce the failure.
  test-setup-go-govulncheck-fail:
    name: setup-go self-test (govulncheck gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app-vulnerable/go.mod
          run-govulncheck: "true"
      - name: assert the govulncheck gate failed and the other gates stayed off
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          VULN: ${{ steps.setup.outputs.govulncheck-outcome }}
          LINT: ${{ steps.setup.outputs.lint-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$VULN" != "failure" ] || [ "$LINT" != "skipped" ] || [ "$FMT" != "skipped" ] || [ "$TEST" != "skipped" ]; then
            echo "::error::expected govulncheck to fail on a fixable advisory with other gates skipped, got composite '$OUTCOME', govulncheck '$VULN', lint '$LINT', fmt '$FMT', test '$TEST'" >&2
            exit 1
          fi

  # Proves two things: the lint gate actually fires rather than silently no-op'ing — a fixture
  # with a real errcheck violation (os.Open's error return discarded), confirmed locally to
  # compile clean but fail `golangci-lint run` before this job existed — and that govulncheck
  # still runs (continue-on-error on each internal step) even though lint already failed, so a
  # caller with both enabled sees both findings in one run rather than losing govulncheck's
  # result to lint's fail-fast. The outer continue-on-error captures the composite step's own
  # outcome instead of letting it fail the job, so the assertion step can check it.
  test-setup-go-lint-catches-real-issue:
    name: setup-go self-test (lint gate fires, govulncheck still runs anyway)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app-broken/go.mod
          run-lint: "true"
          run-govulncheck: "true"
      - name: assert the lint step failed and govulncheck still ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          LINT: ${{ steps.setup.outputs.lint-outcome }}
          VULN: ${{ steps.setup.outputs.govulncheck-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$LINT" != "failure" ]; then
            echo "::error::expected the lint gate to fail on a known-bad fixture, got composite '$OUTCOME', lint '$LINT'" >&2
            exit 1
          fi
          if [ "$VULN" != "success" ] && [ "$VULN" != "failure" ]; then
            echo "::error::govulncheck did not run after lint failed (outcome '$VULN')" >&2
            exit 1
          fi

  # Proves the run-test-race gate fires: a fixture whose only test races on one variable passes
  # without -race and fails under it.
  test-setup-go-race-catches-real-race:
    name: setup-go self-test (race gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app-race/go.mod
          run-test-race: "true"
      - name: assert the race gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          RACE: ${{ steps.setup.outputs.test-race-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$RACE" != "failure" ]; then
            echo "::error::expected the race gate to fail on a racy fixture, got composite '$OUTCOME', race '$RACE'" >&2
            exit 1
          fi

  test-setup-go-test-pass:
    name: setup-go self-test (test gate, clean fixture)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app/go.mod
          run-test: "true"
      - name: assert the test gate passed and the race gate stayed off
        env:
          TEST: ${{ steps.setup.outputs.test-outcome }}
          RACE: ${{ steps.setup.outputs.test-race-outcome }}
        run: |
          if [ "$TEST" != "success" ] || [ "$RACE" != "skipped" ]; then
            echo "::error::expected test-outcome=success and test-race-outcome=skipped, got test '$TEST', race '$RACE'" >&2
            exit 1
          fi

  # Proves the run-test gate fires without -race: the fixture's only test fails under plain go test.
  test-setup-go-test-fail:
    name: setup-go self-test (test gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app-failing/go.mod
          run-test: "true"
      - name: assert the test gate failed and the race gate stayed off
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
          RACE: ${{ steps.setup.outputs.test-race-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$TEST" != "failure" ] || [ "$RACE" != "skipped" ]; then
            echo "::error::expected the test gate to fail and the race gate to stay off, got composite '$OUTCOME', test '$TEST', race '$RACE'" >&2
            exit 1
          fi

  # Proves the run-fmt gate fires: a fixture that is golangci-lint run clean but not formatted.
  test-setup-go-fmt-catches-unformatted:
    name: setup-go self-test (fmt gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app-unformatted/go.mod
          run-lint: "true"
          run-fmt: "true"
      - name: assert only the format gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          LINT: ${{ steps.setup.outputs.lint-outcome }}
          FMT: ${{ steps.setup.outputs.fmt-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$FMT" != "failure" ] || [ "$LINT" != "success" ]; then
            echo "::error::expected golangci-lint run to pass and fmt to fail, got composite '$OUTCOME', lint '$LINT', fmt '$FMT'" >&2
            exit 1
          fi

  # Proves the run-ruff-format gate fires: a fixture that is ruff-check clean but not formatted.
  test-setup-python-ruff-format-catches-unformatted:
    name: setup-python self-test (ruff format gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app-unformatted
          install-args: --locked --group dev
          run-ruff: "true"
          run-ruff-format: "true"
      - name: assert only the format gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          RUFF: ${{ steps.setup.outputs.ruff-outcome }}
          FORMAT: ${{ steps.setup.outputs.ruff-format-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$FORMAT" != "failure" ] || [ "$RUFF" != "success" ]; then
            echo "::error::expected ruff check to pass and ruff format to fail, got composite '$OUTCOME', ruff '$RUFF', format '$FORMAT'" >&2
            exit 1
          fi

  test-setup-python-cold:
    name: setup-python self-test (cold cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app
          install-args: --locked --group dev
      - name: assert deps synced and no exact cache hit
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
        working-directory: .github/test-fixtures/python-app
        run: |
          uv run ruff --version
          if [ "$TEST" != "skipped" ]; then
            echo "::error::expected test-outcome=skipped when run-test is off, got '$TEST'" >&2
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi
      - name: assert the documented version outputs are populated
        env:
          UV_VERSION: ${{ steps.setup.outputs.uv-version }}
          PYTHON_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          if [ -z "$UV_VERSION" ] || [ -z "$PYTHON_VERSION" ]; then
            echo "::error::setup-python outputs are blank: uv-version '$UV_VERSION', python-version '$PYTHON_VERSION'" >&2
            exit 1
          fi

  test-setup-python-warm:
    name: setup-python self-test (warm cache)
    needs: test-setup-python-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app
          install-args: --locked --group dev
      - name: assert cache-hit true
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  # Jobs sharing python-app's lockfile wait for the cold job: a parallel save under the same
  # key would turn its miss into a hit.
  test-setup-python-gates-pass:
    name: setup-python self-test (ruff + format + audit, clean fixture)
    needs: test-setup-python-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app
          install-args: --locked --group dev
          run-ruff: "true"
          run-ruff-format: "true"
          run-audit: "true"

  test-setup-python-test-pass:
    name: setup-python self-test (test gate, clean fixture)
    needs: test-setup-python-cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app
          install-args: --locked --group dev
          run-test: "true"
      - name: assert the test gate passed and the other gates stayed off
        env:
          TEST: ${{ steps.setup.outputs.test-outcome }}
          RUFF: ${{ steps.setup.outputs.ruff-outcome }}
          FORMAT: ${{ steps.setup.outputs.ruff-format-outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$TEST" != "success" ] || [ "$RUFF" != "skipped" ] || [ "$FORMAT" != "skipped" ] || [ "$AUDIT" != "skipped" ]; then
            echo "::error::expected test-outcome=success and the other gates skipped, got test '$TEST', ruff '$RUFF', format '$FORMAT', audit '$AUDIT'" >&2
            exit 1
          fi

  # Proves the run-test gate fires: the fixture's only assertion fails.
  test-setup-python-test-fail:
    name: setup-python self-test (test gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app-failing
          install-args: --locked --group dev
          run-test: "true"
      - name: assert the test gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          TEST: ${{ steps.setup.outputs.test-outcome }}
          RUFF: ${{ steps.setup.outputs.ruff-outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$TEST" != "failure" ] || [ "$RUFF" != "skipped" ] || [ "$AUDIT" != "skipped" ]; then
            echo "::error::expected the test gate to fail and ruff and audit to stay off, got composite '$OUTCOME', test '$TEST', ruff '$RUFF', audit '$AUDIT'" >&2
            exit 1
          fi

  # Proves the lint gate actually fires rather than silently no-op'ing — a fixture with a real
  # F401 (an unused `os` import), confirmed locally to import clean but fail `ruff check` — and
  # that uv audit still runs (continue-on-error on each internal step) even though ruff already
  # failed, so a caller with both enabled sees both findings in one run. The outer
  # continue-on-error captures the composite step's own outcome instead of failing the job.
  test-setup-python-ruff-catches-real-issue:
    name: setup-python self-test (ruff gate fires, audit still runs anyway)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app-broken
          install-args: --locked --group dev
          run-ruff: "true"
          run-audit: "true"
      - name: assert the ruff step failed and uv audit still ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          RUFF: ${{ steps.setup.outputs.ruff-outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$RUFF" != "failure" ]; then
            echo "::error::expected the ruff gate to fail on a known-bad fixture, got composite '$OUTCOME', ruff '$RUFF'" >&2
            exit 1
          fi
          if [ "$AUDIT" != "success" ] && [ "$AUDIT" != "failure" ]; then
            echo "::error::uv audit did not run after ruff failed (outcome '$AUDIT')" >&2
            exit 1
          fi

  # Proves the run-audit gate fires: jinja2 3.1.3 has shipped fixes, so uv audit --locked fails.
  test-setup-python-audit-fail:
    name: setup-python self-test (audit gate fires)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app-vulnerable
          run-audit: "true"
      - name: assert the audit gate failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
          RUFF: ${{ steps.setup.outputs.ruff-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$AUDIT" != "failure" ] || [ "$RUFF" != "skipped" ]; then
            echo "::error::expected the audit gate to fail on a fixable advisory, got composite '$OUTCOME', audit '$AUDIT', ruff '$RUFF'" >&2
            exit 1
          fi

  # The project-less case: uv as a PATH tool for `uvx <tool>`, no uv.lock or pyproject anywhere.
  # Must not error on the empty cache (ignore-nothing-to-cache) or try to sync — this repo's own
  # lint job above calls exactly this shape.
  test-setup-python-skip-install-no-project:
    name: setup-python self-test (skip-install, no project)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-python
        with:
          working-directory: .github
          skip-install: "true"
      - run: uv --version

  # repo-ops' audit job: skip-install + run-audit, because uv audit --locked reads uv.lock
  # rather than the synced environment. The vulnerable fixture is the assertion that the
  # audit step actually ran: a skipped step's outcome is not "failure", and the gate
  # treats a skipped outcome as pass, so a clean fixture would still go green.
  test-setup-python-skip-install-audit:
    name: setup-python self-test (skip-install still audits)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          working-directory: .github/test-fixtures/python-app-vulnerable
          skip-install: "true"
          run-audit: "true"
      - name: assert skip-install still failed the audit gate
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          AUDIT: ${{ steps.setup.outputs.audit-outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$AUDIT" != "failure" ]; then
            echo "::error::skip-install gated or skipped uv audit; expected composite failure and audit-outcome=failure, got composite '$OUTCOME', audit '$AUDIT'" >&2
            exit 1
          fi
