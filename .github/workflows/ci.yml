name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (schema + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # actionlint parses any file it's pointed at as a workflow — it cannot validate a
      # composite action.yml (throws bogus structural errors). Schema-validate those
      # separately; actionlint below is scoped to .github/workflows/*.yml only.
      - name: Schema-validate action.yml files
        run: |
          uvx check-jsonschema --builtin-schema vendor.github-actions setup-bun/action.yml
          uvx check-jsonschema --builtin-schema vendor.github-actions setup-nextjs-bun/action.yml
          uvx check-jsonschema --builtin-schema vendor.github-actions setup-go/action.yml

      # Neither check above can see this: an `inputs.foo` that was never declared resolves to
      # the empty string rather than erroring, so a step gated on one silently never runs.
      # That shipped once, in setup-bun's extra-paths cache.
      - name: Check every referenced input is declared
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          bad = False
          for f in sorted(pathlib.Path(".").glob("*/action.yml")):
              t = f.read_text()
              m = re.search(r"^inputs:\n(.*?)^(?=\w)", t, re.S | re.M)
              declared = set(re.findall(r"^  ([\w-]+):", m.group(1), re.M)) if m else set()
              for name in sorted(set(re.findall(r"inputs\.([\w-]+)", t)) - declared):
                  print(f"::error file={f}::references undeclared input '{name}'")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF

      - name: Install actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" | tar xz actionlint

      - name: Lint workflows
        run: ./actionlint .github/workflows/*.yml

  # actions/cache persists ACROSS separate workflow runs on the same ref (GitHub's real cache
  # backend, not act's throwaway local one) — a cold-cache job only sees a genuine miss on the
  # very first run against a given fixture's lockfile; every later push whose fixture didn't
  # change would incorrectly restore the previous run's cache. Found via a real GitHub-hosted
  # run, not local `act` testing (which resets its cache-server-path per invocation and can't
  # surface this). Fix: wipe both self-test cache prefixes for this ref in one serial job
  # before either -cold job starts, so there's no window for a race between the two fixtures'
  # deletes and saves.
  reset-self-test-caches:
    name: Reset self-test caches (ensure genuinely cold)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete Linux-bun-*, Linux-nextjs-*, setup-go-Linux-*, playwright-Linux-* caches for this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --ref cannot be combined with a numeric cache ID (only with a key string). IDs are
          # already unambiguous, so no --ref is needed on the delete call itself.
          for prefix in Linux-bun- Linux-nextjs- setup-go-Linux- playwright-Linux- Linux-bun-extra-; do
            for id in $(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --json id -q '.[].id'); do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done
          done

  # Each action gets a cold-cache job (proves install works, no exact cache hit) followed by
  # a warm-cache job (needs: <cold job>, so it only starts after the cold job's cache save
  # completed — this is what actually proves cache-hit == 'true' on the second run, since
  # actions/cache saves in a post step that a same-job second invocation would never see in
  # time). setup-bun and setup-nextjs-bun use separate fixtures with different lockfile
  # content, so their exact cache KEYS never collide — but both intentionally share the same
  # restore-keys PREFIX (${{ runner.os }}-bun-, for cross-project cache warmth in real
  # consumers). Because the two cold jobs run in parallel, one fixture's post-step save can
  # land before the other's restore runs, producing a legitimate restore-keys PARTIAL match
  # (cache-hit: 'false') rather than a total miss (cache-hit: ''). Both are valid "not an
  # exact hit" outcomes on a genuinely cold run, so the assertion checks != 'true', not
  # emptiness — a real regression (a stale EXACT match surviving the reset job) still fails
  # this.
  test-setup-bun-cold:
    name: setup-bun self-test (cold cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
      - name: assert deps installed and no exact cache hit
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          test -d .github/test-fixtures/bun-app/node_modules/is-odd
          if [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-bun-warm:
    name: setup-bun self-test (warm cache)
    needs: test-setup-bun-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
      - name: assert cache-hit true
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  # The extra-paths cache is the one cache in this action whose inputs are supplied entirely
  # by the caller, so a self-test is the only thing that proves the wiring resolves at all —
  # the three inputs it reads went undeclared for the life of the feature, which schema
  # validation cannot catch (a reference to an undeclared input is empty, not invalid) and
  # actionlint does not check for composite actions. Cold writes a marker into the extra path
  # and lets the post step save it; warm asserts the marker came back.
  test-setup-bun-extra-cache-cold:
    name: setup-bun self-test (extra-paths cache, cold)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          extra-cache-paths: .turbo-selftest
          extra-cache-key: ${{ github.sha }}
      - name: write the marker the warm job has to see
        run: |
          mkdir -p .turbo-selftest
          echo "$GITHUB_SHA" > .turbo-selftest/marker

  test-setup-bun-extra-cache-warm:
    name: setup-bun self-test (extra-paths cache, warm)
    needs: test-setup-bun-extra-cache-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app
          extra-cache-paths: .turbo-selftest
          extra-cache-key: ${{ github.sha }}
      - name: assert the extra path was restored
        run: |
          if [ ! -f .turbo-selftest/marker ]; then
            echo "::error::extra-cache-paths did not restore .turbo-selftest/marker" >&2
            exit 1
          fi
          if [ "$(cat .turbo-selftest/marker)" != "$GITHUB_SHA" ]; then
            echo "::error::restored marker is not this run's, got '$(cat .turbo-selftest/marker)'" >&2
            exit 1
          fi

  test-setup-nextjs-bun-cold:
    name: setup-nextjs-bun self-test (cold cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app
      - name: assert deps installed and no exact cache hit
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          test -d .github/test-fixtures/nextjs-app/node_modules/is-even
          if [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-nextjs-bun-warm:
    name: setup-nextjs-bun self-test (warm cache)
    needs: test-setup-nextjs-bun-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-nextjs-bun
        with:
          working-directory: .github/test-fixtures/nextjs-app
      - name: assert cache-hit true
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  test-setup-go-cold:
    name: setup-go self-test (cold cache)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app/go.mod
      - name: assert build works and no exact cache hit
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        working-directory: .github/test-fixtures/go-app
        run: |
          go build ./...
          if [ "$CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-go-warm:
    name: setup-go self-test (warm cache)
    needs: test-setup-go-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app/go.mod
      - name: assert cache-hit true
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::expected cache-hit=true on warm run, got '$CACHE_HIT'" >&2
            exit 1
          fi

  test-setup-bun-playwright-cold:
    name: setup-bun self-test (Playwright cache, cold)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-playwright
          install-playwright: "true"
          playwright-browsers: chromium
      - name: assert browser installed and no exact cache hit
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
        run: |
          if [ ! -d ~/.cache/ms-playwright ] || [ -z "$(ls -A ~/.cache/ms-playwright)" ]; then
            echo "::error::expected Playwright browsers installed under ~/.cache/ms-playwright" >&2
            exit 1
          fi
          if [ "$PW_CACHE_HIT" = "true" ]; then
            echo "::error::expected no exact Playwright cache-hit on cold run, got 'true'" >&2
            exit 1
          fi

  test-setup-bun-playwright-warm:
    name: setup-bun self-test (Playwright cache, warm)
    needs: test-setup-bun-playwright-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./setup-bun
        with:
          working-directory: .github/test-fixtures/bun-app-playwright
          install-playwright: "true"
          playwright-browsers: chromium
      - name: assert Playwright cache-hit true
        env:
          PW_CACHE_HIT: ${{ steps.setup.outputs.playwright-cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" != "true" ]; then
            echo "::error::expected Playwright cache-hit=true on warm run, got '$PW_CACHE_HIT'" >&2
            exit 1
          fi

  test-setup-go-lint-vuln-pass:
    name: setup-go self-test (lint + govulncheck, clean fixture)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app/go.mod
          run-lint: "true"
          run-govulncheck: "true"

  # Proves two things: the lint gate actually fires rather than silently no-op'ing — a fixture
  # with a real errcheck violation (os.Open's error return discarded), confirmed locally to
  # compile clean but fail `golangci-lint run` before this job existed — and that govulncheck
  # still runs (continue-on-error on each internal step) even though lint already failed, so a
  # caller with both enabled sees both findings in one run rather than losing govulncheck's
  # result to lint's fail-fast. The outer continue-on-error captures the composite step's own
  # outcome instead of letting it fail the job, so the assertion step can check it.
  test-setup-go-lint-catches-real-issue:
    name: setup-go self-test (lint gate fires, govulncheck still runs anyway)
    needs: reset-self-test-caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        continue-on-error: true
        uses: ./setup-go
        with:
          go-version-file: .github/test-fixtures/go-app-broken/go.mod
          run-lint: "true"
          run-govulncheck: "true"
      - name: assert the lint step actually failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the lint gate to fail on a known-bad fixture, got outcome '$OUTCOME'" >&2
            exit 1
          fi
