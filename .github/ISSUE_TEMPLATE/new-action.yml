name: New action proposal
description: Propose adding a new shared action to this repo
title: "action: "
labels:
  - new-action
body:
  - type: markdown
    attributes:
      value: |
        See [AGENTS.md § Status](../../AGENTS.md#status) for the live list of shipped and
        deferred actions before proposing a new one — it may already be scoped.
  - type: textarea
    id: duplication
    attributes:
      label: What's duplicated across the fleet
      description: Which repos, roughly how many, what the copy-pasted CI block looks like
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Proposed inputs / outputs
    validations:
      required: true
  - type: checkboxes
    id: conventions
    attributes:
      label: Fits this repo's conventions (see AGENTS.md)
      options:
        - label: No actions/checkout inside the action
        - label: No build/test steps baked in (documented opt-in lint/security gates excepted)
        - label: Every wrapped action would be SHA-pinned
        - label: "No inline ${{ inputs.* }} interpolation inside run: blocks"
