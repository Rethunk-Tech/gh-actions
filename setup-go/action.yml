name: Setup Go
description: >
  Install a Go toolchain via actions/setup-go and cache its module and build caches per job.
  Optionally also run golangci-lint and/or govulncheck as a gate on the same job — opt-in, off
  by default. Writes a pass/fail table to the job's step summary.

inputs:
  go-version:
    description: >
      Exact Go version to install (e.g. "1.26.5"). Leave empty to resolve from
      go-version-file instead.
    required: false
    default: ""
  go-version-file:
    description: >
      Path to the go.mod (or go.work) file to resolve the Go version from. Only used when
      go-version is empty. May point into a subdirectory (e.g. "backend/go.mod") when the
      module isn't at the checkout root — the lint/govulncheck steps below run from that same
      subdirectory automatically, with no separate working-directory input: every real fleet
      case that needs one needs the exact directory go-version-file already names.
    required: false
    default: go.mod
  cache-dependency-path:
    description: >
      Glob(s) hashed into the module/build cache key (newline-separated for more than one).
      Leave empty to default to the go.sum next to go-version-file plus go-version-file itself.
    required: false
    default: ""
  run-lint:
    description: >
      When true, downloads golangci-lint (checksum-verified against its release) and runs it
      after the toolchain is set up. Turns this action into a job gate for callers who opt in —
      off by default. Linux and macOS runners only.
    required: false
    default: "false"
  lint-version:
    description: >
      golangci-lint release to run (e.g. "v2.13.2"). Must be a release built with a Go at least as
      new as the module's own go directive — golangci-lint refuses to load a config otherwise
      ("the Go language version used to build golangci-lint is lower than the targeted Go
      version"), which fails the lint gate for a reason that has nothing to do with the code.
      v2.13.2 is built with go1.27.0; the 30 Go modules in the fleet declare go 1.27.
    required: false
    default: v2.13.2
  lint-args:
    description: Extra args for `golangci-lint run` (e.g. --timeout 5m, --build-tags=foo).
    required: false
    default: ""
  run-govulncheck:
    description: >
      When true, runs govulncheck (via `go run`, no binary left installed) after the toolchain
      is set up. Turns this action into a job gate for callers who opt in — off by default.
    required: false
    default: "false"
  govulncheck-version:
    description: govulncheck version to run. Fleet-latest as of this writing.
    required: false
    default: v1.7.0
  govulncheck-args:
    description: Extra args for govulncheck before the scanned path (e.g. -tags=foo).
    required: false
    default: ""

outputs:
  go-version:
    description: The Go version that was installed.
    value: ${{ steps.setup-go.outputs.go-version }}
  cache-hit:
    description: Whether the module/build cache was restored from an exact key match for this job.
    value: ${{ steps.go-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # actions/setup-go's own cache is off: its key is go.mod's hash with no job component and no
    # restore-keys, so every job of a run races for one entry (the first job to finish wins, and
    # a lint job's cache holds no -race or test builds), and any go.mod change is a total miss.
    - name: Setup Go
      id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
        cache: false

    # Derives the module directory from cache-dependency-path or go-version-file rather than
    # taking a separate working-directory input — every real fleet caller's lint/govulncheck
    # directory is exactly one of these two paths' own dirname. cache-dependency-path wins when
    # both are set: a caller that pins an explicit go-version (global-ai-alliance) leaves
    # go-version-file at its "go.mod" default, which would resolve to the checkout root.
    # The cache paths go through $GITHUB_ENV, not step outputs, for the same actions/runner#2009
    # post-step reason setup-nextjs-bun resolves NEXT_CACHE_DIR that way.
    - name: Resolve module directory and cache paths
      id: moddir
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
        CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
        NEEDS_DIR: ${{ inputs.run-lint == 'true' || inputs.run-govulncheck == 'true' }}
      run: |
        if [ -n "$CACHE_DEPENDENCY_PATH" ]; then
          path="$CACHE_DEPENDENCY_PATH"
          deps="$CACHE_DEPENDENCY_PATH"
        else
          path="$GO_VERSION_FILE"
          deps="$(dirname "$GO_VERSION_FILE")/go.sum"$'\n'"$GO_VERSION_FILE"
        fi
        {
          echo "deps<<SETUP_GO_EOF"
          echo "$deps"
          echo "SETUP_GO_EOF"
        } >> "$GITHUB_OUTPUT"
        # A multi-line (multi-module) or glob value has no single dirname. Only the gates need
        # one; fail loudly for them rather than derive a wrong directory.
        case "$path" in
          *$'\n'*|*'*'*)
            if [ "$NEEDS_DIR" = "true" ]; then
              echo "::error::run-lint/run-govulncheck can't derive a working directory from a multi-line or glob cache-dependency-path/go-version-file value ('$path') — pass a single literal path, or leave run-lint/run-govulncheck off for this caller." >&2
              exit 1
            fi
            ;;
          *)
            echo "dir=$(dirname "$path")" >> "$GITHUB_OUTPUT"
            ;;
        esac
        {
          echo "SETUP_GO_BUILD_CACHE=$(go env GOCACHE)"
          echo "SETUP_GO_MOD_CACHE=$(go env GOMODCACHE)"
        } >> "$GITHUB_ENV"

    # Saved in the post step, after the caller's own build/test commands have filled both
    # caches. The job id sits last in the key so that each job keeps its own build profile
    # (claude-format-hooks: lint saved first and every later -race test job restored a cache
    # with no race builds, 34-38s warm). A job's first run, or a dependency change, falls back
    # to the newest cache of any job for the same Go version. Growth is bounded: Go trims build
    # entries unused for five days before the post step saves, and a Go release resets the
    # prefix entirely.
    - name: Cache Go modules and build cache
      id: go-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.SETUP_GO_MOD_CACHE }}
          ${{ env.SETUP_GO_BUILD_CACHE }}
        key: setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(steps.moddir.outputs.deps) }}-${{ github.job }}
        restore-keys: |
          setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(steps.moddir.outputs.deps) }}-
          setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

    # The golangci-lint binary is downloaded rather than cached: the release fetch measured
    # 0.6s (bastion-mfa), no faster than a cache round trip. Its own analysis cache is filled
    # inside this action, so restore and save are split and an exact hit skips the save.
    - name: Restore golangci-lint cache
      id: lint-cache
      if: inputs.run-lint == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/setup-go-golangci-lint
        key: setup-go-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lint-version }}-${{ hashFiles(steps.moddir.outputs.deps) }}
        restore-keys: |
          setup-go-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lint-version }}-

    # Not continue-on-error: a failed download or checksum mismatch is an infrastructure
    # failure, and must not be reported by the gate below as lint findings.
    - name: Install golangci-lint
      id: lint-install
      if: inputs.run-lint == 'true'
      shell: bash
      env:
        LINT_VERSION: ${{ inputs.lint-version }}
        OS_NAME: ${{ runner.os }}
        ARCH_NAME: ${{ runner.arch }}
      run: |
        set -u
        case "$OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "::error::run-lint supports Linux and macOS runners, not $OS_NAME" >&2; exit 1 ;;
        esac
        case "$ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::run-lint has no golangci-lint release for runner arch $ARCH_NAME" >&2; exit 1 ;;
        esac
        version="${LINT_VERSION#v}"
        base="golangci-lint-$version-$os-$arch"
        url="https://github.com/golangci/golangci-lint/releases/download/v$version"
        dir="$RUNNER_TEMP/setup-go-golangci-lint"
        mkdir -p "$dir"
        cd "$dir" || exit 1
        curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 -o "$base.tar.gz" "$url/$base.tar.gz"
        curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 -o checksums.txt "$url/golangci-lint-$version-checksums.txt"
        grep " $base.tar.gz\$" checksums.txt > expected.txt || {
          echo "::error::$base.tar.gz is not listed in the v$version checksums file" >&2
          exit 1
        }
        shasum -a 256 -c expected.txt
        tar -xzf "$base.tar.gz"
        echo "bin=$dir/$base/golangci-lint" >> "$GITHUB_OUTPUT"

    # Both gates below run with continue-on-error: true and report through the final gate step
    # rather than failing fast — a caller with both enabled sees BOTH findings in one run,
    # matching what bastion-intent-ledger-replicator/BoundMCP already get from running lint and
    # govulncheck as independent jobs today. A masked continue-on-error failure still shows its
    # own warning icon in the Actions UI, so each tool's result stays individually visible.
    - name: golangci-lint
      id: lint
      if: inputs.run-lint == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GOLANGCI_LINT: ${{ steps.lint-install.outputs.bin }}
        LINT_ARGS: ${{ inputs.lint-args }}
      run: |
        export GOLANGCI_LINT_CACHE="$HOME/.cache/setup-go-golangci-lint"
        # golangci-lint-action verified the config before running; keep that, since a key the
        # schema rejects is otherwise ignored silently.
        if "$GOLANGCI_LINT" config path >/dev/null 2>&1; then
          "$GOLANGCI_LINT" config verify
        fi
        if [ -n "$LINT_ARGS" ]; then
          # LINT_ARGS may hold multiple space-separated flags; word-splitting is intentional.
          # shellcheck disable=SC2086
          "$GOLANGCI_LINT" run $LINT_ARGS
        else
          "$GOLANGCI_LINT" run
        fi

    - name: Save golangci-lint cache
      if: inputs.run-lint == 'true' && steps.lint-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/setup-go-golangci-lint
        key: ${{ steps.lint-cache.outputs.cache-primary-key }}

    - name: govulncheck
      id: govulncheck
      if: inputs.run-govulncheck == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        GOVULNCHECK_ARGS: ${{ inputs.govulncheck-args }}
      run: |
        if [ -n "$GOVULNCHECK_ARGS" ]; then
          # GOVULNCHECK_ARGS may hold multiple space-separated flags; word-splitting is intentional.
          # shellcheck disable=SC2086
          go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" $GOVULNCHECK_ARGS ./...
        else
          go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...
        fi

    # Writes a plain pass/fail table to the job's step summary (the Actions UI "Summary" tab)
    # — every caller gets at-a-glance visibility without parsing step logs. Deliberately NOT a
    # severity-tiered/JSON-parsed report: that's real per-caller business logic (e.g. citadel's
    # own vuln-gate.sh auto-files GitHub issues per CVE) this generic fleet action has no
    # business opinionating about. A caller that wants that keeps its own downstream step
    # reading govulncheck's `-json` output directly instead of enabling run-govulncheck here.
    - name: Gate on lint/govulncheck results
      if: inputs.run-lint == 'true' || inputs.run-govulncheck == 'true'
      shell: bash
      env:
        RUN_LINT: ${{ inputs.run-lint }}
        RUN_VULN: ${{ inputs.run-govulncheck }}
        LINT_OUTCOME: ${{ steps.lint.outcome }}
        VULN_OUTCOME: ${{ steps.govulncheck.outcome }}
      run: |
        row() {
          local enabled="$1" outcome="$2" label="$3"
          if [ "$enabled" != 'true' ]; then
            echo "| $label | — not run |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$outcome" = "failure" ]; then
            echo "| $label | ❌ fail |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| $label | ✅ pass |" >> "$GITHUB_STEP_SUMMARY"
          fi
        }
        {
          echo "## setup-go lint/vuln gate"
          echo "| Check | Result |"
          echo "| --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"
        row "$RUN_LINT" "$LINT_OUTCOME" "golangci-lint"
        row "$RUN_VULN" "$VULN_OUTCOME" "govulncheck"

        failed=0
        if [ "$LINT_OUTCOME" = "failure" ]; then
          echo "::error::golangci-lint found issues — see the golangci-lint step above" >&2
          failed=1
        fi
        if [ "$VULN_OUTCOME" = "failure" ]; then
          echo "::error::govulncheck found vulnerabilities — see the govulncheck step above" >&2
          failed=1
        fi
        exit "$failed"
