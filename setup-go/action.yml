name: Setup Go
description: >
  Install a Go toolchain via actions/setup-go and cache its module and build caches per job
  (cache-build false stores modules only).
  Optionally also run `go test ./...`, the race-enabled test suite, golangci-lint,
  golangci-lint fmt, govulncheck, and/or gorelease as gates on the same job — opt-in, off by default
  except govulncheck, which is on by default.
  Cross-compiles for Windows on the existing runner by default (`GOOS=windows go test
  -exec=true ./...`) so `*_windows.go` is type-checked without a Windows runner.
  Writes a pass/fail table to the job's step summary.

inputs:
  go-version:
    description: >
      Exact Go version to install (e.g. "1.26.5"). Leave empty to resolve from
      go-version-file instead.
    required: false
    default: ""
  go-version-file:
    description: >
      Path to the go.mod (or go.work) file to resolve the Go version from. Only used when
      go-version is empty. May point into a subdirectory (e.g. "backend/go.mod") when the
      module isn't at the checkout root — the test/lint/fmt/govulncheck steps below run from that
      same subdirectory automatically, with no separate working-directory input: every real
      fleet case that needs one needs the exact directory go-version-file already names.
    required: false
    default: go.mod
  cache-dependency-path:
    description: >
      Glob(s) hashed into the module/build cache key (newline-separated for more than one).
      Leave empty to default to the go.sum next to go-version-file plus go-version-file itself.
    required: false
    default: ""
  cache:
    description: >
      When false, restore and save no Go cache at all. Release workflows set this false so a
      poisoned cache entry can't reach a published artifact; everything else keeps the default.
    required: false
    default: "true"
  cache-build:
    description: >
      When false, cache the module download cache only and skip the build-cache prune. A job
      that never compiles sets this false. Default true keeps the module and build caches.
    required: false
    default: "true"
  cache-key-suffix:
    description: >
      Appended to the build and lint caches' primary keys only (restore falls back to the suffix-free
      prefix). On a repo whose go.mod is stable the primary key otherwise always hits and a hit
      never saves, freezing the build cache at its first save; pass a value that changes on the
      caller's refresh schedule (e.g. the date) to save a fresh one. Empty keeps the key unchanged.
    required: false
    default: ""
  run-test-race:
    description: >
      When true, runs `go test -race ./...` from the module directory after the toolchain is set
      up. Turns this action into a test gate for callers who opt in — off by default.
      Separate from run-test, which runs `go test ./...` and does not pass `-race`.
    required: false
    default: "false"
  run-test:
    description: >
      When true, runs `go test ./...` from the module directory after the toolchain is set up.
      Separate from run-test-race: this command does not pass `-race`, and setting run-test does
      not enable the race gate. Off by default.
    required: false
    default: "false"
  run-windows-compile:
    description: >
      When true, cross-compiles every package for Windows (`GOOS=windows go test -exec=true
      ./...`) from the module directory after the toolchain is set up. `-exec=true` links
      each test binary then invokes `true` instead of running it, so Windows-only sources
      are type-checked on the existing Linux runner. Default true; set false in a repo that
      does not support Windows.
    required: false
    default: "true"
  run-lint:
    description: >
      When true, downloads golangci-lint (checksum-verified against its release) and runs
      `golangci-lint run` after the toolchain is set up. Turns this action into a job gate for callers who opt in —
      off by default. Linux and macOS runners only.
    required: false
    default: "false"
  run-fmt:
    description: >
      When true, runs `golangci-lint fmt --diff` after the toolchain is set up. Separate from
      run-lint because `golangci-lint run` does not run formatters, and enabling both from one
      input would fail every repo that has only ever run `golangci-lint run`. Off by default.
      Uses the same checksum-verified binary as run-lint. Linux and macOS runners only.
    required: false
    default: "false"
  lint-version:
    description: >
      golangci-lint release to run (e.g. "v2.15.0"). Must be a release built with a Go at least as
      new as the module's own go directive — golangci-lint refuses to load a config otherwise
      ("the Go language version used to build golangci-lint is lower than the targeted Go
      version"), which fails the lint gate for a reason that has nothing to do with the code.
      v2.15.0 is built with go1.27; the 30 Go modules in the fleet declare go 1.27.
    required: false
    default: v2.15.0
  lint-args:
    description: Extra args for `golangci-lint run` (e.g. --timeout 5m, --build-tags=foo).
    required: false
    default: ""
  run-govulncheck:
    description: >
      When true, runs govulncheck (via `go run`, no binary left installed) after the toolchain
      is set up. On by default, so every Go module gets scanned; set "false" to opt out. A caller
      with no go.mod at its module root (a tools-only job or a go.work-only root) skips the step with a notice.
    required: false
    default: "true"
  govulncheck-version:
    description: govulncheck version to run.
    required: false
    default: v1.9.0
  govulncheck-args:
    description: Extra args for govulncheck before the scanned path (e.g. -tags=foo).
    required: false
    default: ""
  run-gorelease:
    description: >
      When true, runs gorelease (via `go run`) against the module's latest published version
      and fails on incompatible exported-API changes unless the module's CHANGELOG.md
      `[Unreleased]` section declares the break (a `### Removed` heading or a `Breaking:` line).
      Skipped with a notice when the module has no published version yet. Off by default.
    required: false
    default: "false"
  gorelease-version:
    description: golang.org/x/exp pseudo-version to run gorelease from.
    required: false
    default: v0.0.0-20261121134650-e1094eeca1b5

outputs:
  go-version:
    description: The Go version that was installed.
    value: ${{ steps.setup-go.outputs.go-version }}
  cache-hit:
    description: Whether the module/build cache was restored from an exact key match for this job.
    value: ${{ steps.go-cache.outputs.cache-hit || steps.go-mod-cache.outputs.cache-hit }}
  cache-mode:
    description: >
      `build` when the module and build caches are stored (the default), `modules` when
      cache-build is false and only the module cache is stored, or `off` when cache is false.
    value: ${{ inputs.cache == 'false' && 'off' || (inputs.cache-build == 'false' && 'modules' || 'build') }}
  test-race-outcome:
    description: Outcome of the `go test -race` gate (success, failure or skipped when run-test-race is off).
    value: ${{ steps.test-race.outcome }}
  test-outcome:
    description: Outcome of the `go test` gate (success, failure or skipped when run-test is off).
    value: ${{ steps.test.outcome }}
  lint-outcome:
    description: Outcome of the golangci-lint gate (success, failure or skipped when run-lint is off).
    value: ${{ steps.lint.outcome }}
  fmt-outcome:
    description: Outcome of the `golangci-lint fmt --diff` gate (success, failure or skipped when run-fmt is off).
    value: ${{ steps.fmt.outcome }}
  govulncheck-outcome:
    description: Outcome of the govulncheck gate (success, failure, or skipped when run-govulncheck is off or there is no go.mod).
    value: ${{ steps.govulncheck.outcome }}
  gorelease-outcome:
    description: Outcome of the gorelease gate (success, failure or skipped when run-gorelease is off).
    value: ${{ steps.gorelease.outcome }}
  windows-compile-outcome:
    description: Outcome of the Windows compile gate (success, failure or skipped when run-windows-compile is off).
    value: ${{ steps.windows-compile.outcome }}

runs:
  using: composite
  steps:
    # actions/setup-go's own cache is off: its key is go.mod's hash with no job component and no
    # restore-keys, so every job of a run races for one entry (the first job to finish wins, and
    # a lint job's cache holds no -race or test builds), and any go.mod change is a total miss.
    - name: Setup Go
      id: setup-go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
        cache: false

    # Derives the module directory from cache-dependency-path or go-version-file rather than
    # taking a separate working-directory input — every real fleet caller's lint/govulncheck
    # directory is exactly one of these two paths' own dirname. cache-dependency-path wins when
    # both are set: a caller that pins an explicit go-version (global-ai-alliance) leaves
    # go-version-file at its "go.mod" default, which would resolve to the checkout root.
    # The cache paths go through $GITHUB_ENV, not step outputs, for the same actions/runner#2009
    # post-step reason setup-nextjs-bun resolves NEXT_CACHE_DIR that way.
    - name: Resolve module directory and cache paths
      id: moddir
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
        CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
        # hashFiles takes one glob per argument; a newline-joined list is one unmatched pattern.
        HASH_FILES_SINGLE: ${{ hashFiles(inputs.cache-dependency-path) }}
        NEEDS_DIR: ${{ inputs.run-test == 'true' || inputs.run-test-race == 'true' || inputs.run-lint == 'true' || inputs.run-fmt == 'true' || inputs.run-govulncheck == 'true' || inputs.run-gorelease == 'true' }}
      run: |
        . "${GITHUB_ACTION_PATH}/../scripts/github-workflow-io.sh"
        hash_listed() {
          local files=() p f
          # globstar so **/go.sum matches nested modules; bash 3.2 (macOS /bin/bash)
          # has no globstar and treats ** as *, one directory deep. nullglob so a
          # miss stays empty instead of hashing the literal pattern as a filename.
          shopt -s globstar 2>/dev/null || true
          shopt -s nullglob
          while IFS= read -r p || [ -n "$p" ]; do
            [ -z "$p" ] && continue
            # p may be a glob; pathname expansion is intentional.
            # shellcheck disable=SC2086
            for f in $p; do
              [ -f "$f" ] || continue
              files+=("$f")
            done
          done
          # A caller that only installs Go tools (go install x@v) has no module; key its cache
          # on the toolchain alone rather than failing the job.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no-modules"
            return 0
          fi
          {
            printf '%s\n' "${files[@]}" | LC_ALL=C sort | while IFS= read -r f; do
              github_sha256 "$f"
            done
          } | github_sha256 | awk '{print $1}'
        }

        if [ -n "$CACHE_DEPENDENCY_PATH" ]; then
          path="$CACHE_DEPENDENCY_PATH"
          case "$CACHE_DEPENDENCY_PATH" in
            *$'\n'*)
              SETUP_GO_DEPS_HASH=$(printf '%s\n' "$CACHE_DEPENDENCY_PATH" | hash_listed)
              ;;
            *)
              SETUP_GO_DEPS_HASH="$HASH_FILES_SINGLE"
              ;;
          esac
        else
          path="$GO_VERSION_FILE"
          SETUP_GO_DEPS_HASH=$(printf '%s\n' "$(dirname "$GO_VERSION_FILE")/go.sum" "$GO_VERSION_FILE" | hash_listed)
        fi
        echo "SETUP_GO_DEPS_HASH=$SETUP_GO_DEPS_HASH" >> "$GITHUB_ENV"
        # A glob, or a list spanning several directories, has no single dirname: go-version-file
        # names the module root when given. The explicit gates fail loudly rather than guess;
        # the default-on Windows compile just skips.
        dir=""
        case "$path" in
          *'*'*) ;;
          *$'\n'*)
            dirs=$(printf '%s\n' "$path" | sed '/^[[:space:]]*$/d' | while IFS= read -r p; do dirname "$p"; done | sort -u)
            case "$dirs" in *$'\n'*) ;; *) dir="$dirs" ;; esac
            ;;
          *)
            github_require_single_line go-version-file "$path"
            dir=$(dirname "$path")
            ;;
        esac
        if [ -z "$dir" ] && [ -n "$GO_VERSION_FILE" ]; then
          github_require_single_line go-version-file "$GO_VERSION_FILE"
          dir=$(dirname "$GO_VERSION_FILE")
        fi
        if [ -z "$dir" ] && [ "$NEEDS_DIR" = "true" ]; then
          echo "::error::$(github_encode "run-test/run-test-race/run-lint/run-fmt/run-govulncheck can't derive a working directory from a multi-line or glob cache-dependency-path value ('$path') — set go-version-file, pass a single literal path, or leave the gate inputs off for this caller.")" >&2
          exit 1
        fi
        if [ -n "$dir" ]; then
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          # A caller that only installs Go tools has no module to cross-compile.
          if [ -f "$dir/go.mod" ] || [ -f "$dir/go.work" ]; then
            echo "module=true" >> "$GITHUB_OUTPUT"
          fi
          # govulncheck refuses a go.work-only root, so it keys on go.mod alone.
          if [ -f "$dir/go.mod" ]; then
            echo "gomod=true" >> "$GITHUB_OUTPUT"
          fi
        fi
        {
          echo "SETUP_GO_BUILD_CACHE=$(go env GOCACHE)"
          echo "SETUP_GO_MOD_CACHE=$(go env GOMODCACHE)"
        } >> "$GITHUB_ENV"

    # Saved in the post step, after the caller's own build/test commands and any action gates have filled both
    # caches. The job id precedes the hash in the key so that each job keeps its own build profile
    # and restore-keys prefer the same job's newest cache, even across a dependency change
    # (a release job's cache has no race builds, so a test job restoring it compiled cold).
    # Only a job's first run falls back to the newest cache of any job for the same Go
    # version, for its module cache, and the prune post step bounds what that carries forward.
    - name: Cache Go modules and build cache
      id: go-cache
      if: inputs.cache != 'false' && inputs.cache-build != 'false' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.SETUP_GO_MOD_CACHE }}
          ${{ env.SETUP_GO_BUILD_CACHE }}
        key: setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}.${{ env.SETUP_GO_DEPS_HASH }}${{ inputs.cache-key-suffix && format('-{0}', inputs.cache-key-suffix) || '' }}
        restore-keys: |
          setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}.${{ env.SETUP_GO_DEPS_HASH }}
          setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}.
          setup-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

    - name: Cache Go modules
      id: go-mod-cache
      if: inputs.cache != 'false' && inputs.cache-build == 'false' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SETUP_GO_MOD_CACHE }}
        key: setup-go-mod-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}.${{ env.SETUP_GO_DEPS_HASH }}
        restore-keys: |
          setup-go-mod-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}.${{ env.SETUP_GO_DEPS_HASH }}
          setup-go-mod-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}.
          setup-go-mod-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

    # Go's own trim only drops entries unused for five days, so each dependency change stacks
    # a new build generation on the restored one until the runner's disk fills. Go bumps an
    # entry's mtime when a build uses it and the mtime is over an hour old, so the entries the
    # saving job used all sit within two hours of the newest one (an hour of job time plus that
    # bump); keep those and drop the rest. A job over two hours long can lose some of its own
    # entries, which costs a rebuild of them, not correctness.
    # Runs in post, after the caller compiled: a main-step prune sees only restored mtimes,
    # so the old generation stays "recent" and is saved back. Listed after actions/cache so
    # post order is prune then save. $/ is this repo at the running commit (not the caller).
    - name: Prune build cache to the saving job's working set
      if: inputs.cache != 'false' && inputs.cache-build != 'false'
      uses: $/setup-go/prune-post
      env:
        SETUP_GO_BUILD_CACHE: ${{ env.SETUP_GO_BUILD_CACHE }}


    # The golangci-lint binary is downloaded rather than cached: the release fetch measured
    # 0.6s (bastion-mfa), no faster than a cache round trip. Its own analysis cache is filled
    # inside this action, so restore and save are split and an exact hit skips the save.
    - name: Restore golangci-lint cache
      id: lint-cache
      if: (inputs.run-lint == 'true' || inputs.run-fmt == 'true') && github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/setup-go-golangci-lint
        key: setup-go-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lint-version }}-${{ env.SETUP_GO_DEPS_HASH }}${{ inputs.cache-key-suffix && format('-{0}', inputs.cache-key-suffix) || '' }}
        restore-keys: |
          setup-go-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lint-version }}-

    # Not continue-on-error: a failed download or checksum mismatch is an infrastructure
    # failure, and must not be reported by the gate below as lint findings.
    - name: Install golangci-lint
      id: lint-install
      if: inputs.run-lint == 'true' || inputs.run-fmt == 'true'
      shell: bash
      env:
        LINT_VERSION: ${{ inputs.lint-version }}
        OS_NAME: ${{ runner.os }}
        ARCH_NAME: ${{ runner.arch }}
      run: |
        set -u
        . "${GITHUB_ACTION_PATH}/../scripts/github-workflow-io.sh"
        case "$OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "::error::$(github_encode "run-lint/run-fmt supports Linux and macOS runners, not $OS_NAME")" >&2; exit 1 ;;
        esac
        case "$ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::$(github_encode "run-lint/run-fmt has no golangci-lint release for runner arch $ARCH_NAME")" >&2; exit 1 ;;
        esac
        version="${LINT_VERSION#v}"
        case "$version" in
          *[/[:space:]]*|*\'*|*\"*)
            echo "::error::$(github_encode "lint-version must be a single release tag without slashes or whitespace (got '$LINT_VERSION')")" >&2
            exit 1
            ;;
        esac
        base="golangci-lint-$version-$os-$arch"
        url="https://github.com/golangci/golangci-lint/releases/download/v$version"
        dir="$RUNNER_TEMP/setup-go-golangci-lint"
        mkdir -p "$dir"
        cd "$dir" || exit 1
        curl -fsSL --max-time 60 --retry 5 --retry-all-errors --retry-max-time 120 -o "$base.tar.gz" "$url/$base.tar.gz"
        curl -fsSL --max-time 60 --retry 5 --retry-all-errors --retry-max-time 120 -o checksums.txt "$url/golangci-lint-$version-checksums.txt"
        grep " $base.tar.gz\$" checksums.txt > expected.txt || {
          echo "::error::$(github_encode "$base.tar.gz is not listed in the v$version checksums file")" >&2
          exit 1
        }
        github_sha256 -c expected.txt
        tar -xzf "$base.tar.gz"
        echo "bin=$dir/$base/golangci-lint" >> "$GITHUB_OUTPUT"

    # Every gate below runs with continue-on-error: true and reports through the final gate step
    # rather than failing fast, so a caller enabling more than one sees every finding in one run.
    # A masked continue-on-error failure still shows its own warning icon in the Actions UI, so
    # each tool's result stays individually visible.
    - name: go test
      id: test
      if: inputs.run-test == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      run: go test ./...

    - name: go test -race
      id: test-race
      if: inputs.run-test-race == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      run: go test -race ./...

    # Linux jobs never type-check *_windows.go / //go:build windows; -exec=true links each
    # test binary then invokes true so this stays a compile check, no Windows runner.
    - name: Windows compile
      id: windows-compile
      if: inputs.run-windows-compile == 'true' && steps.moddir.outputs.module == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GOOS: windows
      run: |
        # A go.work root with modules in subdirectories matches nothing under ./..., so name each module.
        pkgs=./...
        if [ -f go.work ] && [ ! -f go.mod ]; then
          pkgs=$(go list -m -f '{{.Path}}/...')
        fi
        # Module paths hold no spaces; word-splitting the list is intentional.
        # shellcheck disable=SC2086
        go test -exec=true $pkgs

    - name: golangci-lint
      id: lint
      if: inputs.run-lint == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GOLANGCI_LINT: ${{ steps.lint-install.outputs.bin }}
        LINT_ARGS: ${{ inputs.lint-args }}
      run: |
        export GOLANGCI_LINT_CACHE="$HOME/.cache/setup-go-golangci-lint"
        # golangci-lint-action verified the config before running; keep that, since a key the
        # schema rejects is otherwise ignored silently.
        if "$GOLANGCI_LINT" config path >/dev/null 2>&1; then
          "$GOLANGCI_LINT" config verify
        fi
        if [ -n "$LINT_ARGS" ]; then
          # LINT_ARGS may hold multiple space-separated flags; word-splitting is intentional.
          # shellcheck disable=SC2086
          "$GOLANGCI_LINT" run $LINT_ARGS
        else
          "$GOLANGCI_LINT" run
        fi

    - name: golangci-lint fmt
      id: fmt
      if: inputs.run-fmt == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GOLANGCI_LINT: ${{ steps.lint-install.outputs.bin }}
      run: |
        export GOLANGCI_LINT_CACHE="$HOME/.cache/setup-go-golangci-lint"
        # Same config check as `golangci-lint run`: a key the schema rejects is otherwise ignored.
        if "$GOLANGCI_LINT" config path >/dev/null 2>&1; then
          "$GOLANGCI_LINT" config verify
        fi
        "$GOLANGCI_LINT" fmt --diff

    - name: Save golangci-lint cache
      if: (inputs.run-lint == 'true' || inputs.run-fmt == 'true') && steps.lint-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/setup-go-golangci-lint
        key: ${{ steps.lint-cache.outputs.cache-primary-key }}

    - name: govulncheck skipped (no module)
      if: inputs.run-govulncheck == 'true' && steps.moddir.outputs.gomod != 'true'
      shell: bash
      run: echo "::notice::govulncheck skipped, no go.mod at the module root for this caller"

    - name: govulncheck
      id: govulncheck
      if: inputs.run-govulncheck == 'true' && steps.moddir.outputs.gomod == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        GOVULNCHECK_ARGS: ${{ inputs.govulncheck-args }}
      run: |
        . "${GITHUB_ACTION_PATH}/../scripts/github-workflow-io.sh"
        case "$GOVULNCHECK_VERSION" in
          *[/@[:space:]]*)
            echo "::error::$(github_encode "govulncheck-version must be a single module version without slashes, extra @, or whitespace (got '$GOVULNCHECK_VERSION')")" >&2
            exit 1
            ;;
        esac
        if [ -n "$GOVULNCHECK_ARGS" ]; then
          # GOVULNCHECK_ARGS may hold multiple space-separated flags; word-splitting is intentional.
          # shellcheck disable=SC2086
          go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" $GOVULNCHECK_ARGS ./...
        else
          go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...
        fi

    - name: gorelease
      id: gorelease
      if: inputs.run-gorelease == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ steps.moddir.outputs.dir }}
      env:
        GORELEASE_VERSION: ${{ inputs.gorelease-version }}
      run: |
        . "${GITHUB_ACTION_PATH}/../scripts/github-workflow-io.sh"
        case "$GORELEASE_VERSION" in
          *[/@[:space:]]*)
            echo "::error::$(github_encode "gorelease-version must be a single module version without slashes, extra @, or whitespace (got '$GORELEASE_VERSION')")" >&2
            exit 1
            ;;
        esac
        # gorelease exits 0 on incompatible changes, so the report is read rather than the status.
        status=0
        report=$(go run "golang.org/x/exp/cmd/gorelease@$GORELEASE_VERSION" 2>&1) || status=$?
        printf '%s\n' "$report"
        if printf '%s\n' "$report" | grep -q '^gorelease: could not find base version'; then
          echo "::notice::gorelease skipped: the module has no published version to compare against"
          exit 0
        fi
        if printf '%s\n' "$report" | grep -q '^## incompatible changes'; then
          if [ -f CHANGELOG.md ] && awk '/^## /{on=($0 ~ /^## \[Unreleased\]/);next} on' CHANGELOG.md | grep -qE '^### Removed|Breaking:'; then
            echo "::notice::incompatible changes are declared in CHANGELOG.md [Unreleased]"
            exit 0
          fi
          echo "::error::gorelease found incompatible exported-API changes that CHANGELOG.md [Unreleased] does not declare (add a '### Removed' heading or a 'Breaking:' line)" >&2
          exit 1
        fi
        exit "$status"

    # Writes a plain pass/fail table to the job's step summary (the Actions UI "Summary" tab)
    # — every caller gets at-a-glance visibility without parsing step logs. Deliberately NOT a
    # severity-tiered/JSON-parsed report: that's real per-caller business logic (e.g. citadel's
    # own vuln-gate.sh auto-files GitHub issues per CVE) this generic fleet action has no
    # business opinionating about. A caller that wants that keeps its own downstream step
    # reading govulncheck's `-json` output directly instead of enabling run-govulncheck here.
    - name: Gate on test/lint/fmt/govulncheck results
      if: inputs.run-test == 'true' || inputs.run-test-race == 'true' || inputs.run-lint == 'true' || inputs.run-fmt == 'true' || inputs.run-govulncheck == 'true' || inputs.run-gorelease == 'true' || inputs.run-windows-compile == 'true'
      shell: bash
      env:
        RUN_TEST: ${{ inputs.run-test }}
        RUN_TEST_RACE: ${{ inputs.run-test-race }}
        RUN_LINT: ${{ inputs.run-lint }}
        RUN_FMT: ${{ inputs.run-fmt }}
        RUN_VULN: ${{ inputs.run-govulncheck }}
        RUN_GORELEASE: ${{ inputs.run-gorelease }}
        RUN_WINDOWS_COMPILE: ${{ inputs.run-windows-compile }}
        TEST_OUTCOME: ${{ steps.test.outcome }}
        TEST_RACE_OUTCOME: ${{ steps.test-race.outcome }}
        LINT_OUTCOME: ${{ steps.lint.outcome }}
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        VULN_OUTCOME: ${{ steps.govulncheck.outcome }}
        GORELEASE_OUTCOME: ${{ steps.gorelease.outcome }}
        WINDOWS_COMPILE_OUTCOME: ${{ steps.windows-compile.outcome }}
      run: |
        row() {
          local enabled="$1" outcome="$2" label="$3"
          if [ "$enabled" != 'true' ]; then
            echo "| $label | — not run |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$outcome" = "skipped" ]; then
            echo "| $label | — skipped |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$outcome" = "failure" ]; then
            echo "| $label | ❌ fail |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| $label | ✅ pass |" >> "$GITHUB_STEP_SUMMARY"
          fi
        }
        {
          echo "## setup-go test/lint/fmt/vuln gate"
          echo "| Check | Result |"
          echo "| --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"
        row "$RUN_TEST" "$TEST_OUTCOME" "go test"
        row "$RUN_TEST_RACE" "$TEST_RACE_OUTCOME" "go test -race"
        row "$RUN_LINT" "$LINT_OUTCOME" "golangci-lint"
        row "$RUN_FMT" "$FMT_OUTCOME" "golangci-lint fmt --diff"
        row "$RUN_VULN" "$VULN_OUTCOME" "govulncheck"
        row "$RUN_GORELEASE" "$GORELEASE_OUTCOME" "gorelease"
        row "$RUN_WINDOWS_COMPILE" "$WINDOWS_COMPILE_OUTCOME" "Windows compile"

        failed=0
        if [ "$TEST_OUTCOME" = "failure" ]; then
          echo "::error::go test failed — see the go test step above" >&2
          failed=1
        fi
        if [ "$TEST_RACE_OUTCOME" = "failure" ]; then
          echo "::error::go test -race failed — see the go test -race step above" >&2
          failed=1
        fi
        if [ "$LINT_OUTCOME" = "failure" ]; then
          echo "::error::golangci-lint found issues — see the golangci-lint step above" >&2
          failed=1
        fi
        if [ "$FMT_OUTCOME" = "failure" ]; then
          echo "::error::golangci-lint fmt --diff found unformatted files — see the golangci-lint fmt step above" >&2
          failed=1
        fi
        if [ "$VULN_OUTCOME" = "failure" ]; then
          echo "::error::govulncheck failed (exit 3 means vulnerabilities, anything else means the scan could not run); see the govulncheck step above" >&2
          failed=1
        fi
        if [ "$GORELEASE_OUTCOME" = "failure" ]; then
          echo "::error::gorelease failed — see the gorelease step above" >&2
          failed=1
        fi
        if [ "$WINDOWS_COMPILE_OUTCOME" = "failure" ]; then
          echo "::error::Windows compile failed — see the Windows compile step above" >&2
          failed=1
        fi
        exit "$failed"
